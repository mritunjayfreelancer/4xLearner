<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>4X Learner — Viral Shorts Studio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Noto+Sans+Devanagari:wght@600;700;800;900&family=Poppins:wght@600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-base: #06090f;
            --panel-bg: #0d1424;
            --input-bg: #070b14;
            --border-ui: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-gold: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-base);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            height: 100dvh;
            width: 100vw;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* Fixed Mobile Top Navigation Bar */
        .mobile-header {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 54px;
            background: rgba(13, 20, 36, 0.92);
            backdrop-filter: blur(14px);
            z-index: 150;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .mobile-brand {
            font-weight: 900;
            font-size: 0.95rem;
            color: #fbbf24;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .toggle-btn {
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
        }

        .drawer-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(4px);
            z-index: 180;
        }

        /* Sidebar Control Panel */
        .sidebar {
            width: 430px;
            min-width: 430px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border-ui);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            z-index: 200;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sidebar::-webkit-scrollbar {
            width: 5px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        .panel-brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 12px;
        }

        .panel-brand h2 {
            font-size: 1.1rem;
            font-weight: 900;
            color: #fbbf24;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .close-btn {
            display: none;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 1.4rem;
            cursor: pointer;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        label span {
            color: #38bdf8;
            font-size: 0.65rem;
        }

        input,
        select,
        textarea {
            background: var(--input-bg);
            color: #fff;
            border: 1px solid #23314d;
            padding: 9px 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s ease;
        }

        textarea {
            resize: vertical;
            height: 155px;
            font-family: 'Poppins', monospace;
            font-size: 0.8rem;
            line-height: 1.45;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--accent-gold);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn-ui {
            padding: 11px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.82rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            border: none;
            transition: 0.2s all;
        }

        .btn-ui:active {
            transform: scale(0.97);
        }

        .btn-theme {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #fff;
        }

        .btn-apply {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #fff;
        }

        .btn-image {
            background: linear-gradient(135deg, #059669, #10b981);
            color: #fff;
        }

        .btn-video {
            background: linear-gradient(135deg, #e11d48, #be123c);
            color: #fff;
            padding: 13px;
            font-size: 0.92rem;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4);
            border-radius: 12px;
        }

        .btn-video:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Preview Stage Area */
        .preview-stage {
            flex: 1;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #030508;
            padding: 16px;
            position: relative;
            overflow: hidden;
        }

        .reels-shell {
            height: 94dvh;
            aspect-ratio: 9 / 16;
            max-width: 100%;
            border-radius: 30px;
            background: #111;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.95), 0 0 0 2px #1e293b;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #previewCanvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 28px;
        }

        /* Mobile Breakpoint Rules */
        @media (max-width: 880px) {
            body {
                flex-direction: column;
            }

            .mobile-header {
                display: flex;
            }

            .drawer-backdrop.active {
                display: block;
            }

            .sidebar {
                position: fixed;
                left: 0;
                bottom: 0;
                top: 0;
                width: 86%;
                max-width: 360px;
                min-width: unset;
                transform: translateX(-100%);
                box-shadow: 20px 0 50px rgba(0, 0, 0, 0.95);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .close-btn {
                display: block;
            }

            .preview-stage {
                padding: 62px 8px 12px 8px;
            }

            .reels-shell {
                height: calc(100dvh - 78px);
                max-width: calc((100dvh - 78px) * 9 / 16);
            }
        }
    </style>
</head>

<body>

    <script>

        // 20 Viral Fast Landing Animation Presets
        const ANIMS_20 = [
            { name: "01. Elastic Left Rush", type: "elasticL" },
            { name: "02. Elastic Right Rush", type: "elasticR" },
            { name: "03. Fast Drop Bounce", type: "drop" },
            { name: "04. Fast Snap Zoom", type: "snapZoom" },
            { name: "05. Pop Rubber Band", type: "rubberPop" },
            { name: "06. 3D Flip Horizon", type: "flipX" },

            { name: "14. Swing 3D Entrance", type: "swing" },
            { name: "15. Matrix Drop Down", type: "matrix" },
            { name: "16. Magnetic Pull", type: "magnetic" },
            { name: "17. Curtain Split", type: "curtain" },

            { name: "19. Rotate In Spring", type: "rotSpring" },
            { name: "20. 4X Signature Slam", type: "signature" }
        ];

        let activeTheme = THEMES_20[0];
        const canvas = document.getElementById("previewCanvas");
        const ctx = canvas.getContext("2d");

        // Init Dropdowns
        const themeSelect = document.getElementById("themeSelect");
        THEMES_20.forEach((t, i) => {
            const opt = document.createElement("option");
            opt.value = i;
            opt.textContent = t.name;
            themeSelect.appendChild(opt);
        });

        const animSelect = document.getElementById("animSelect");
        ANIMS_20.forEach((a, i) => {
            const opt = document.createElement("option");
            opt.value = a.type;
            opt.textContent = a.name;
            animSelect.appendChild(opt);
        });

        function toggleDrawer() {
            document.getElementById("sidebar").classList.toggle("open");
            document.getElementById("backdrop").classList.toggle("active");
        }

        function parseScript() {
            const lines = document.getElementById("pasteBox").value.trim().split("\n").filter(l => l.trim().length > 0);
            return lines.map((line, idx) => {
                let parts = line.split("|").map(p => p.trim());
                if (parts.length < 3 && line.includes("=")) {
                    const equalParts = line.split("=").map(p => p.trim());
                    return {
                        num: `${idx + 1}`,
                        hindi: equalParts[0] || `शब्द ${idx + 1}`,
                        english: equalParts[1] || `Word ${idx + 1}`,
                        pronounce: ``,
                        icon: `fa-check`
                    };
                }
                return {
                    num: parts[0] || `${idx + 1}`,
                    hindi: parts[1] || `शब्द ${idx + 1}`,
                    english: parts[2] || `Word ${idx + 1}`,
                    pronounce: parts[3] || ``,
                    icon: parts[4] || `fa-check`
                };
            });
        }

        function applySingleInput() {
            updateCanvas();
            runPreviewAnimation();
            if (window.innerWidth <= 880) toggleDrawer();
        }

        function applyThemeChange() {
            activeTheme = THEMES_20[parseInt(themeSelect.value, 10)];
            updateCanvas();
        }

        // Draw Complete Frame
        function renderScene(targetCtx, W, H, progress = 1.0, animType = "none") {
            // 1. Background
            targetCtx.save();
            const grad = targetCtx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, activeTheme.bg[0]);
            grad.addColorStop(1, activeTheme.bg[1]);
            targetCtx.fillStyle = grad;
            targetCtx.fillRect(0, 0, W, H);

            // Ambient Glow
            const glow = targetCtx.createRadialGradient(W / 2, 350, 40, W / 2, 350, 650);
            glow.addColorStop(0, "rgba(245, 158, 11, 0.12)");
            glow.addColorStop(1, "rgba(0,0,0,0)");
            targetCtx.fillStyle = glow;
            targetCtx.fillRect(0, 0, W, H);
            targetCtx.restore();

            // 2. Header Bar
            targetCtx.save();
            targetCtx.fillStyle = "rgba(0,0,0,0.45)";
            roundRect(targetCtx, 60, 75, 360, 84, 42, true);

            const bGrad = targetCtx.createLinearGradient(72, 85, 175, 145);
            bGrad.addColorStop(0, "#f59e0b");
            bGrad.addColorStop(1, "#ef4444");
            targetCtx.fillStyle = bGrad;
            roundRect(targetCtx, 72, 85, 95, 64, 18, true);

            targetCtx.fillStyle = "#ffffff";
            targetCtx.font = "900 38px 'Montserrat', sans-serif";
            targetCtx.fillText("4X", 94, 131);

            targetCtx.font = "900 36px 'Montserrat', sans-serif";
            targetCtx.fillText("LEARNER", 182, 131);

            targetCtx.fillStyle = "rgba(255,255,255,0.95)";
            targetCtx.font = "800 30px 'Montserrat', sans-serif";
            targetCtx.fillText("@4xlearner", W - 245, 130);
            targetCtx.restore();

            // 3. Heading & Hooks
            targetCtx.save();
            targetCtx.textAlign = "center";
            targetCtx.fillStyle = "rgba(245, 158, 11, 0.25)";
            roundRect(targetCtx, W / 2 - 230, 205, 460, 52, 26, true);
            targetCtx.fillStyle = "#fbbf24";
            targetCtx.font = "900 24px 'Montserrat', sans-serif";
            targetCtx.fillText(document.getElementById("badgeInput").value, W / 2, 240);

            targetCtx.fillStyle = activeTheme.text;
            targetCtx.font = "900 48px 'Noto Sans Devanagari', 'Montserrat', sans-serif";
            targetCtx.fillText(document.getElementById("titleInput").value, W / 2, 315);

            targetCtx.font = "700 32px 'Montserrat', sans-serif";
            targetCtx.globalAlpha = 0.85;
            targetCtx.fillText(document.getElementById("subInput").value, W / 2, 365);
            targetCtx.restore();

            // 4. Cards Rendering
            const data = parseScript();
            const startY = 445;
            const cardH = 205;
            const gap = 34;

            data.forEach((item, idx) => {
                const y = startY + idx * (cardH + gap);
                const color = activeTheme.colors[idx % activeTheme.colors.length];

                let itemProgress = Math.min(1, Math.max(0, (progress - (idx * 0.08)) / 0.4));
                let ease = 1 - Math.pow(1 - itemProgress, 3);

                targetCtx.save();
                applyAnimationTransform(targetCtx, itemProgress, ease, idx, animType, 60, y, 960, cardH);

                // Card Shell
                targetCtx.fillStyle = activeTheme.card;
                targetCtx.shadowColor = "rgba(0,0,0,0.35)";
                targetCtx.shadowBlur = 25;
                targetCtx.shadowOffsetY = 8;
                roundRect(targetCtx, 0, 0, 960, cardH, 36, true);
                targetCtx.shadowColor = "transparent";

                // Number Left Shape
                targetCtx.fillStyle = color;
                targetCtx.beginPath();
                targetCtx.moveTo(0, 0);
                targetCtx.lineTo(150, 0);
                targetCtx.lineTo(190, cardH / 2);
                targetCtx.lineTo(150, cardH);
                targetCtx.lineTo(0, cardH);
                targetCtx.closePath();
                targetCtx.fill();

                targetCtx.fillStyle = "#ffffff";
                targetCtx.font = "900 70px 'Montserrat', sans-serif";
                targetCtx.textAlign = "center";
                targetCtx.fillText(item.num, 80, cardH / 2 + 25);

                // Hindi Word
                targetCtx.fillStyle = activeTheme.hi;
                targetCtx.font = "900 44px 'Noto Sans Devanagari', 'Montserrat', sans-serif";
                targetCtx.textAlign = "left";
                targetCtx.fillText(item.hindi, 225, 88);

                // Pronunciation
                targetCtx.fillStyle = color;
                targetCtx.font = "700 30px 'Noto Sans Devanagari', 'Montserrat', sans-serif";
                targetCtx.fillText(item.pronounce, 225, 145);

                // English Word
                targetCtx.fillStyle = activeTheme.hi;
                targetCtx.font = "900 42px 'Montserrat', sans-serif";
                targetCtx.textAlign = "right";
                targetCtx.fillText(item.english, 835, 88);

                targetCtx.fillStyle = color;
                targetCtx.font = "700 28px 'Montserrat', sans-serif";
                targetCtx.fillText("English Meaning", 835, 140);

                // Right Rounded Pill
                targetCtx.fillStyle = color;
                roundRect(targetCtx, 860, 42, 70, 120, 35, true);
                targetCtx.fillStyle = "#ffffff";
                targetCtx.font = "900 40px 'Montserrat', sans-serif";
                targetCtx.textAlign = "center";
                targetCtx.fillText("✓", 895, 115);

                targetCtx.restore();
            });

            // 5. Engagement Hook Footer
            targetCtx.save();
            targetCtx.fillStyle = "rgba(0,0,0,0.5)";
            roundRect(targetCtx, W / 2 - 380, H - 160, 760, 72, 36, true);
            targetCtx.fillStyle = "#ffffff";
            targetCtx.font = "800 28px 'Montserrat', sans-serif";
            targetCtx.textAlign = "center";
            targetCtx.fillText("🎯 Save for later & Follow @4xlearner!", W / 2, H - 116);
            targetCtx.restore();
        }

        function applyAnimationTransform(targetCtx, p, e, idx, type, x, y, w, h) {
            targetCtx.globalAlpha = p;
            let tx = 0, ty = 0, scale = 1, rotate = 0;

            switch (type) {
                case "elasticL":
                    tx = -750 * (1 - e);
                    break;
                case "elasticR":
                    tx = 750 * (1 - e);
                    break;
                case "drop":
                    ty = -600 * (1 - e);
                    scale = 0.8 + 0.2 * e;
                    break;
                case "snapZoom":
                    scale = 0.15 + 0.85 * e;
                    break;
                case "rubberPop":
                    scale = 0.3 + 0.7 * e;
                    break;
                case "flipX":
                    scale = 0.5 + 0.5 * e;
                    ty = (1 - e) * 200;
                    break;
                case "skewL":
                    tx = -600 * (1 - e);
                    break;
                case "skewR":
                    tx = 600 * (1 - e);
                    break;
                case "vortex":
                    rotate = -0.3 * (1 - e);
                    scale = 0.5 + 0.5 * e;
                    break;
                case "slam":
                    scale = 1.3 - 0.3 * e;
                    ty = -200 * (1 - e);
                    break;
                case "diagL":
                    tx = -500 * (1 - e);
                    ty = -300 * (1 - e);
                    break;
                case "diagR":
                    tx = 500 * (1 - e);
                    ty = -300 * (1 - e);
                    break;
                case "rise":
                    ty = 500 * (1 - e);
                    break;
                case "swing":
                    rotate = Math.sin((1 - e) * Math.PI) * 0.2;
                    break;
                case "matrix":
                    ty = -800 * (1 - e);
                    break;
                case "magnetic":
                    tx = (idx % 2 === 0 ? -600 : 600) * (1 - e);
                    break;
                case "curtain":
                    scale = 0.2 + 0.8 * e;
                    break;
                case "glitch":
                    tx = (1 - e) * Math.sin(p * 20) * 40;
                    break;
                case "rotSpring":
                    rotate = 0.2 * (1 - e);
                    scale = 0.7 + 0.3 * e;
                    break;
                case "signature":
                default:
                    tx = (idx % 2 === 0 ? -700 : 700) * (1 - e);
                    scale = 0.85 + 0.15 * e;
                    break;
            }

            targetCtx.translate(x + tx, y + ty);
            targetCtx.rotate(rotate);
            targetCtx.scale(scale, scale);
        }

        function roundRect(targetCtx, x, y, width, height, radius, fill) {
            targetCtx.beginPath();
            targetCtx.moveTo(x + radius, y);
            targetCtx.lineTo(x + width - radius, y);
            targetCtx.quadraticCurveTo(x + width, y, x + width, y + radius);
            targetCtx.lineTo(x + width, y + height - radius);
            targetCtx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            targetCtx.lineTo(x + radius, y + height);
            targetCtx.quadraticCurveTo(x, y + height, x, y + height - radius);
            targetCtx.lineTo(x, y + radius);
            targetCtx.quadraticCurveTo(x, y, x + radius, y);
            targetCtx.closePath();
            if (fill) targetCtx.fill();
        }

        function updateCanvas() {
            renderScene(ctx, 1080, 1920, 1.0, "none");
        }

        let animFrameId = null;
        function runPreviewAnimation() {
            if (animFrameId) cancelAnimationFrame(animFrameId);
            const chosenAnim = animSelect.value;
            const startTime = performance.now();
            const duration = 1400; // 1.4 seconds fast landing

            function step(now) {
                const elapsed = now - startTime;
                const progress = Math.min(1.0, elapsed / duration);
                renderScene(ctx, 1080, 1920, progress, chosenAnim);

                if (elapsed < duration) {
                    animFrameId = requestAnimationFrame(step);
                } else {
                    renderScene(ctx, 1080, 1920, 1.0, "none");
                }
            }
            animFrameId = requestAnimationFrame(step);
        }

        function exportStaticImage() {
            const expCanvas = document.createElement("canvas");
            expCanvas.width = 1080;
            expCanvas.height = 1920;
            const expCtx = expCanvas.getContext("2d");
            renderScene(expCtx, 1080, 1920, 1.0, "none");

            const a = document.createElement("a");
            a.download = `4XLearner_Shorts_${Date.now()}.png`;
            a.href = expCanvas.toDataURL("image/png", 1.0);
            a.click();
        }

        async function exportVideoReel() {
            if (document.getElementById("sidebar").classList.contains("open")) {
                toggleDrawer();
            }

            const btn = document.getElementById("videoBtn");
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Rendering 60FPS...`;
            btn.disabled = true;

            const W = 1080, H = 1920;
            const vCanvas = document.createElement("canvas");
            vCanvas.width = W;
            vCanvas.height = H;
            const vCtx = vCanvas.getContext("2d");

            const stream = vCanvas.captureStream(60);
            const recorder = new MediaRecorder(stream, {
                mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm'
            });
            const chunks = [];

            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: "video/webm" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `4XLearner_Reel_${Date.now()}.webm`;
                a.click();
                btn.innerHTML = `<i class="fa-solid fa-circle-play"></i> Export 1080x1920 60FPS Video`;
                btn.disabled = false;
            };

            recorder.start();
            const totalDuration = 4500;
            const startTime = performance.now();
            const animType = animSelect.value;

            function recordStep(now) {
                const elapsed = now - startTime;
                const progress = Math.min(1.0, elapsed / 1600);

                renderScene(vCtx, W, H, progress, animType);

                if (elapsed < totalDuration) {
                    requestAnimationFrame(recordStep);
                } else {
                    recorder.stop();
                }
            }
            requestAnimationFrame(recordStep);
        }

        // Start Default
        applyThemeChange();
        runPreviewAnimation();
    </script>
