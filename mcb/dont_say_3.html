<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

    <title>4X LEARNER — Neon Laser Split PRO</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg: #03050a;
            --panel: #080c15;
            --panel2: #0b111d;
            --line: rgba(255, 255, 255, .09);
            --cyan: #00eaff;
            --red: #ff2455;
            --green: #00ff91;
            --text: #fff;
            --muted: #8290a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Plus Jakarta Sans", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: var(--bg);
            color: #fff;
        }

        body {
            overflow-x: hidden;
        }

        /* ================= HEADER ================= */

        header {
            height: 68px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 0 20px;
            background: rgba(5, 8, 15, .94);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--line);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .logo {
            width: 42px;
            height: 42px;
            flex: none;
            display: grid;
            place-items: center;
            border-radius: 13px;
            font-family: Montserrat, sans-serif;
            font-size: 15px;
            font-weight: 900;
            background: linear-gradient(135deg, #00eaff, #6d00ff);
            box-shadow: 0 0 25px rgba(0, 234, 255, .35);
        }

        .brand-title {
            font-family: Montserrat, sans-serif;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: .5px;
        }

        .brand-sub {
            margin-top: 2px;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1px;
            color: var(--cyan);
        }

        .header-actions {
            display: flex;
            gap: 7px;
        }

        .head-btn {
            border: 1px solid var(--line);
            background: #111827;
            color: #fff;
            border-radius: 10px;
            padding: 9px 13px;
            font-size: 10px;
            font-weight: 900;
            cursor: pointer;
        }

        .head-btn:hover {
            border-color: var(--cyan);
        }

        /* ================= MAIN ================= */

        .studio {
            display: grid;
            grid-template-columns: 400px 1fr;
            min-height: calc(100vh - 68px);
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            background: linear-gradient(180deg, #080c15, #050810);
            border-right: 1px solid var(--line);
            padding: 16px;
            overflow-y: auto;
            max-height: calc(100vh - 68px);
        }

        .section {
            margin-bottom: 17px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            color: var(--cyan);
            font-family: Montserrat, sans-serif;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .section-title:after {
            content: "";
            height: 1px;
            flex: 1;
            background: var(--line);
        }

        .input-card {
            padding: 12px;
            border: 1px solid rgba(0, 234, 255, .18);
            border-radius: 14px;
            background: #050811;
        }

        textarea {
            width: 100%;
            min-height: 155px;
            resize: vertical;
            outline: none;
            border: 1px solid rgba(255, 255, 255, .09);
            border-radius: 10px;
            padding: 11px;
            background: #02040a;
            color: #fff;
            font-size: 11px;
            line-height: 1.55;
        }

        textarea:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 15px rgba(0, 234, 255, .15);
        }

        .primary {
            width: 100%;
            margin-top: 8px;
            padding: 12px;
            border: 0;
            border-radius: 10px;
            color: #fff;
            font-family: Montserrat, sans-serif;
            font-weight: 900;
            font-size: 11px;
            cursor: pointer;
            background: linear-gradient(90deg, #ff2054, #00eaff);
            box-shadow: 0 8px 25px rgba(0, 234, 255, .18);
        }

        /* sliders */

        .slider {
            margin-bottom: 12px;
        }

        .slider-top {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 800;
            color: var(--muted);
        }

        .slider-top strong {
            color: var(--cyan);
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--cyan);
        }

        /* ================= RATIO ================= */

        .ratios {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .ratio {
            min-height: 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: #0b111c;
            color: #8290a5;
            cursor: pointer;
            font-family: Montserrat, sans-serif;
            font-size: 10px;
            font-weight: 900;
        }

        .ratio small {
            margin-top: 2px;
            font-family: inherit;
            font-size: 7px;
            opacity: .75;
        }

        .ratio.active {
            color: #001015;
            background: var(--cyan);
            border-color: var(--cyan);
            box-shadow: 0 0 16px rgba(0, 234, 255, .35);
        }

        /* ================= CUSTOM SIZE ================= */

        .custom-size {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
        }

        .size-field {
            background: #050811;
            border: 1px solid var(--line);
            border-radius: 9px;
            padding: 8px;
        }

        .size-field span {
            display: block;
            font-size: 8px;
            color: var(--muted);
            font-weight: 900;
            margin-bottom: 4px;
        }

        .size-field input {
            width: 100%;
            background: transparent;
            border: 0;
            outline: 0;
            color: #fff;
            font-size: 11px;
            font-weight: 900;
        }

        /* ================= THEMES ================= */

        .theme-box {
            max-height: 190px;
            overflow-y: auto;
            padding: 7px;
            background: #03050a;
            border: 1px solid var(--line);
            border-radius: 10px;
        }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .theme {
            height: 29px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 7px;
            font-size: 7px;
            font-weight: 900;
            color: #fff;
            cursor: pointer;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            border: 1px solid transparent;
        }

        .theme.active {
            border-color: #fff;
            box-shadow: 0 0 13px rgba(255, 255, 255, .4);
        }

        /* ================= EXPORT ================= */

        .export {
            display: grid;
            gap: 8px;
        }

        .export button {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 11px;
            cursor: pointer;
            font-family: Montserrat, sans-serif;
            font-size: 11px;
            font-weight: 900;
        }

        .export-image {
            color: #001014;
            background: linear-gradient(90deg, #00eaff, #008dff);
            box-shadow: 0 8px 25px rgba(0, 234, 255, .2);
        }

        .export-copy {
            color: #fff;
            background: #111827;
            border: 1px solid var(--line) !important;
        }

        /* ================= WORKSPACE ================= */

        .workspace {
            min-width: 0;
            min-height: calc(100vh - 68px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 22px;
            background:
                radial-gradient(circle at 50% 30%, rgba(0, 234, 255, .04), transparent 35%),
                #020409;
        }

        .preview-info {
            margin-bottom: 10px;
            color: #718096;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .preview-frame {
            width: min(100%, 440px);
            max-height: calc(100vh - 130px);
            aspect-ratio: 9/16;
            position: relative;
            overflow: hidden;
            border: 8px solid #111827;
            border-radius: 28px;
            background: #000;
            box-shadow:
                0 25px 70px rgba(0, 0, 0, .8),
                0 0 50px rgba(0, 234, 255, .06);
        }

        .canvas-wrap {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #000;
        }

        #renderCanvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* ================= TOAST ================= */

        .toast {
            position: fixed;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%);
            z-index: 999;
            display: none;
            max-width: 90%;
            padding: 11px 17px;
            border-radius: 10px;
            background: #00eaff;
            color: #001014;
            font-size: 10px;
            font-weight: 900;
            box-shadow: 0 10px 30px rgba(0, 234, 255, .35);
        }

        /* ================= MOBILE ================= */

        @media(max-width:900px) {

            header {
                height: auto;
                min-height: 62px;
                padding: 9px 12px;
            }

            .brand-sub {
                display: none;
            }

            .brand-title {
                font-size: 13px;
            }

            .logo {
                width: 38px;
                height: 38px;
            }

            .header-actions {
                gap: 5px;
            }

            .head-btn {
                padding: 8px 9px;
                font-size: 8px;
            }

            .studio {
                display: flex;
                flex-direction: column;
            }

            .workspace {
                order: 1;
                min-height: auto;
                padding: 15px 8px 20px;
            }

            .preview-frame {
                width: min(92vw, 390px);
                max-height: 70vh;
                border-width: 6px;
                border-radius: 23px;
            }

            .sidebar {
                order: 2;
                max-height: none;
                overflow: visible;
                border-right: 0;
                border-top: 1px solid var(--line);
                padding: 13px;
            }

            .theme-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        @media(max-width:430px) {

            .header-actions .head-btn:first-child {
                display: none;
            }

            .preview-frame {
                width: 94vw;
                max-height: 68vh;
            }

            .ratios {
                grid-template-columns: repeat(2, 1fr);
            }

            .theme-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>

        /* =========================================================
           STATE
        ========================================================= */

        let themeIndex = 0;

        let currentTheme = {
            name: THEMES[0][0],
            red: THEMES[0][1],
            cyan: THEMES[0][2],
            laser: THEMES[0][3],
            green: THEMES[0][4],
            bg: THEMES[0][5]
        };

        let currentWidth = 2160;
        let currentHeight = 3840;

        let yOffset = 0;
        let scale = 1;

        let data = {
            hook: "COMMON ENGLISH MISTAKE",
            wrong: "I HAVE A DOUBT.",
            right: "I HAVE A QUESTION.",
            brand: "4X LEARNER"
        };


        /* =========================================================
           CANVAS
        ========================================================= */

        const canvas = document.getElementById("renderCanvas");
        const ctx = canvas.getContext("2d", {
            alpha: false,
            desynchronized: false
        });


        /* =========================================================
           THEME UI
        ========================================================= */

        const themeGrid = document.getElementById("themeGrid");

        THEMES.forEach((t, index) => {

            const el = document.createElement("div");

            el.className = "theme" + (index === 0 ? " active" : "");

            el.textContent = (index + 1) + " " + t[0];

            el.style.background =
                `linear-gradient(135deg,${t[1]},${t[2]})`;

            el.onclick = () => {

                document
                    .querySelectorAll(".theme")
                    .forEach(x => x.classList.remove("active"));

                el.classList.add("active");

                themeIndex = index;

                currentTheme = {
                    name: t[0],
                    red: t[1],
                    cyan: t[2],
                    laser: t[3],
                    green: t[4],
                    bg: t[5]
                };

                render();

            };

            themeGrid.appendChild(el);

        });


        /* =========================================================
           RATIO
        ========================================================= */

        const RATIO_SIZE = {

            "9:16": [2160, 3840],
            "1:1": [2160, 2160],
            "4:5": [2160, 2700],
            "16:9": [3840, 2160]

        };


        function setRatio(r, button) {

            document
                .querySelectorAll(".ratio")
                .forEach(x => x.classList.remove("active"));

            button.classList.add("active");

            currentWidth = RATIO_SIZE[r][0];
            currentHeight = RATIO_SIZE[r][1];

            document.getElementById("customWidth").value = currentWidth;
            document.getElementById("customHeight").value = currentHeight;

            updatePreviewRatio();

            render();

        }


        function useCustomSize() {

            let w = parseInt(document.getElementById("customWidth").value);
            let h = parseInt(document.getElementById("customHeight").value);

            if (!w || !h) return;

            w = Math.max(200, Math.min(10000, w));
            h = Math.max(200, Math.min(10000, h));

            currentWidth = w;
            currentHeight = h;

            document
                .querySelectorAll(".ratio")
                .forEach(x => x.classList.remove("active"));

            updatePreviewRatio();

            render();

            toast("Custom canvas applied: " + w + " × " + h);

        }


        function updatePreviewRatio() {

            const frame = document.getElementById("previewFrame");

            frame.style.aspectRatio =
                currentWidth + " / " + currentHeight;

            document.getElementById("previewInfo").textContent =
                currentWidth + " × " + currentHeight +
                " • CUSTOM CANVAS";

        }


        /* =========================================================
           CONTROLS
        ========================================================= */

        function updateControls() {

            yOffset =
                parseInt(document.getElementById("ySlider").value) || 0;

            scale =
                parseFloat(document.getElementById("scaleSlider").value) || 1;

            document.getElementById("yValue").textContent = yOffset;

            document.getElementById("scaleValue").textContent =
                scale.toFixed(2) + "x";

            render();

        }


        /* =========================================================
           TEXT PARSER
        ========================================================= */

        function parseContent() {

            const text = document.getElementById("smartText").value;

            if (!text.trim()) return;

            text.split(/\r?\n/).forEach(line => {

                const index = line.indexOf(":");

                if (index < 0) return;

                const key =
                    line.slice(0, index)
                        .trim()
                        .toLowerCase();

                const value =
                    line.slice(index + 1)
                        .trim();

                if (!value) return;

                if (
                    key === "hook" ||
                    key === "topic" ||
                    key === "badge"
                ) {
                    data.hook = value.toUpperCase();
                }

                else if (
                    key === "wrong" ||
                    key === "dont"
                ) {
                    data.wrong = value.toUpperCase();
                }

                else if (
                    key === "right" ||
                    key === "say"
                ) {
                    data.right = value.toUpperCase();
                }

                else if (key === "brand") {
                    data.brand = value.toUpperCase();
                }

            });

            render();

            toast("Poster updated successfully");

        }


        function loadSample() {

            document.getElementById("smartText").value =
                `Hook: COMMON ENGLISH MISTAKE
Wrong: I HAVE A DOUBT.
Right: I HAVE A QUESTION.
Brand: 4X LEARNER`;

            parseContent();

        }


        /* =========================================================
           TEXT FIT ENGINE
        ========================================================= */

        function fitFont(text, maxWidth, startSize, minSize, fontWeight = "900") {

            let size = startSize;

            while (size > minSize) {

                ctx.font =
                    `${fontWeight} ${size}px Montserrat`;

                if (ctx.measureText(text).width <= maxWidth) {
                    return size;
                }

                size -= 2;

            }

            return minSize;
        }


        /* =========================================================
           SMART MULTILINE
        ========================================================= */

        function wrapText(text, maxWidth, fontSize) {

            ctx.font = `900 ${fontSize}px Montserrat`;

            const words = text.trim().split(/\s+/);

            const lines = [];

            let line = "";

            words.forEach(word => {

                const test = line
                    ? line + " " + word
                    : word;

                if (ctx.measureText(test).width <= maxWidth) {

                    line = test;

                } else {

                    if (line) lines.push(line);

                    line = word;

                }

            });

            if (line) lines.push(line);

            return lines;

        }


        /* =========================================================
           SAFE CENTER TEXT
        ========================================================= */

        function drawCenteredText(
            text,
            x,
            y,
            maxWidth,
            startSize,
            color,
            shadowColor
        ) {

            let size = fitFont(
                text,
                maxWidth,
                startSize,
                Math.max(24, startSize * .42)
            );

            const lines = wrapText(text, maxWidth, size);

            const lineHeight = size * 1.02;

            const totalHeight =
                lines.length * lineHeight;

            ctx.save();

            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            ctx.font = `900 ${size}px Montserrat`;

            ctx.lineJoin = "round";

            lines.forEach((line, i) => {

                const yy =
                    y
                    - (totalHeight / 2)
                    + (i + .5) * lineHeight;

                /* extrusion */

                for (let d = 12; d >= 1; d--) {

                    ctx.fillStyle = "rgba(0,0,0,.75)";

                    ctx.fillText(
                        line,
                        x + d * .65,
                        yy + d * .85
                    );

                }

                /* outline */

                ctx.lineWidth = Math.max(5, size * .075);

                ctx.strokeStyle = "#000";

                ctx.strokeText(
                    line,
                    x,
                    yy
                );

                /* glow */

                ctx.shadowColor = shadowColor;

                ctx.shadowBlur = Math.max(12, size * .18);

                ctx.fillStyle = color;

                ctx.fillText(
                    line,
                    x,
                    yy
                );

                ctx.shadowBlur = 0;

            });

            ctx.restore();

        }


        /* =========================================================
           LABEL
        ========================================================= */

        function drawLabel(
            text,
            x,
            y,
            width,
            color
        ) {

            const h = Math.max(42, width * .055);

            ctx.save();

            ctx.fillStyle = "rgba(0,0,0,.55)";

            ctx.strokeStyle = color;

            ctx.lineWidth = 2;

            roundRect(
                ctx,
                x - width / 2,
                y - h / 2,
                width,
                h,
                h / 2
            );

            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = "#fff";

            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            let fs = fitFont(
                text,
                width * .82,
                h * .38,
                16
            );

            ctx.font = `900 ${fs}px Montserrat`;

            ctx.fillText(text, x, y);

            ctx.restore();

        }


        /* =========================================================
           ROUNDED RECT
        ========================================================= */

        function roundRect(c, x, y, w, h, r) {

            r = Math.min(r, w / 2, h / 2);

            c.beginPath();

            c.moveTo(x + r, y);

            c.arcTo(x + w, y, x + w, y + h, r);

            c.arcTo(x + w, y + h, x, y + h, r);

            c.arcTo(x, y + h, x, y, r);

            c.arcTo(x, y, x + w, y, r);

            c.closePath();

        }


        /* =========================================================
           CROSS
        ========================================================= */

        function drawCross(x, y, size, color) {

            ctx.save();

            ctx.translate(x, y);

            ctx.rotate(-8 * Math.PI / 180);

            ctx.lineCap = "round";

            ctx.lineJoin = "round";

            /* black outer */

            ctx.shadowColor = "#000";
            ctx.shadowBlur = size * .25;

            ctx.strokeStyle = "#000";
            ctx.lineWidth = size * .32;

            ctx.beginPath();

            ctx.moveTo(-size * .42, -size * .42);
            ctx.lineTo(size * .42, size * .42);

            ctx.moveTo(size * .42, -size * .42);
            ctx.lineTo(-size * .42, size * .42);

            ctx.stroke();

            /* neon */

            ctx.shadowColor = color;
            ctx.shadowBlur = size * .25;

            ctx.strokeStyle = color;
            ctx.lineWidth = size * .22;

            ctx.beginPath();

            ctx.moveTo(-size * .42, -size * .42);
            ctx.lineTo(size * .42, size * .42);

            ctx.moveTo(size * .42, -size * .42);
            ctx.lineTo(-size * .42, size * .42);

            ctx.stroke();

            ctx.restore();

        }


        /* =========================================================
           CHECK
        ========================================================= */

        function drawCheck(x, y, size, color) {

            ctx.save();

            ctx.translate(x, y);

            ctx.rotate(-8 * Math.PI / 180);

            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            ctx.shadowColor = "#000";
            ctx.shadowBlur = size * .25;

            ctx.strokeStyle = "#000";
            ctx.lineWidth = size * .31;

            ctx.beginPath();

            ctx.moveTo(-size * .45, 0);
            ctx.lineTo(-size * .10, size * .34);
            ctx.lineTo(size * .48, -size * .42);

            ctx.stroke();

            ctx.shadowColor = color;
            ctx.shadowBlur = size * .25;

            ctx.strokeStyle = color;
            ctx.lineWidth = size * .21;

            ctx.beginPath();

            ctx.moveTo(-size * .45, 0);
            ctx.lineTo(-size * .10, size * .34);
            ctx.lineTo(size * .48, -size * .42);

            ctx.stroke();

            ctx.restore();

        }


        /* =========================================================
           BACKGROUND
        ========================================================= */

        function drawBackground(w, h) {

            ctx.fillStyle = currentTheme.bg;
            ctx.fillRect(0, 0, w, h);

            /* top ambient */

            let g1 = ctx.createRadialGradient(
                w * .2, h * .28, 0,
                w * .2, h * .28, w * .65
            );

            g1.addColorStop(
                0,
                currentTheme.red + "48"
            );

            g1.addColorStop(
                1,
                "transparent"
            );

            ctx.fillStyle = g1;
            ctx.fillRect(0, 0, w, h);


            let g2 = ctx.createRadialGradient(
                w * .8, h * .7, 0,
                w * .8, h * .7, w * .65
            );

            g2.addColorStop(
                0,
                currentTheme.green + "38"
            );

            g2.addColorStop(
                1,
                "transparent"
            );

            ctx.fillStyle = g2;
            ctx.fillRect(0, 0, w, h);


            /* grid */

            ctx.save();

            ctx.globalAlpha = .07;

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;

            const gap = Math.max(70, w * .035);

            for (let x = 0; x < w; x += gap) {

                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
                ctx.stroke();

            }

            for (let y = 0; y < h; y += gap) {

                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
                ctx.stroke();

            }

            ctx.restore();


            /* subtle particles — fixed, not random */

            ctx.save();

            for (let i = 0; i < 35; i++) {

                const px =
                    ((i * 137) % 1000) / 1000 * w;

                const py =
                    ((i * 271) % 1000) / 1000 * h;

                const s =
                    Math.max(4, w * .004);

                ctx.globalAlpha = .18;

                ctx.fillStyle =
                    i % 2
                        ? currentTheme.cyan
                        : currentTheme.red;

                ctx.beginPath();

                ctx.arc(px, py, s, 0, Math.PI * 2);

                ctx.fill();

            }

            ctx.restore();

        }


        /* =========================================================
           LASER
        ========================================================= */

        function drawLaser(w, h) {

            const x1 = w * .04;
            const y1 = h * .80;

            const x2 = w * .96;
            const y2 = h * .26;

            ctx.save();

            ctx.lineCap = "round";

            /* large glow */

            ctx.shadowColor = currentTheme.laser;
            ctx.shadowBlur = Math.max(30, w * .035);

            ctx.strokeStyle = currentTheme.laser;
            ctx.lineWidth = Math.max(18, w * .018);

            ctx.beginPath();

            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);

            ctx.stroke();

            /* white core */

            ctx.shadowColor = "#fff";
            ctx.shadowBlur = 15;

            ctx.strokeStyle = "#fff";
            ctx.lineWidth = Math.max(4, w * .005);

            ctx.beginPath();

            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);

            ctx.stroke();

            ctx.restore();

        }


        /* =========================================================
           MAIN RENDER
        ========================================================= */

        function render() {

            const w = currentWidth;
            const h = currentHeight;

            canvas.width = w;
            canvas.height = h;

            ctx.clearRect(0, 0, w, h);

            drawBackground(w, h);

            const minSide = Math.min(w, h);

            const landscape = w > h * 1.25;
            const square = Math.abs(w - h) < 100;

            /*
               SAFE COMPOSITION SYSTEM
        
               Header zone
               ↓
               Don't Say
               ↓
               Say This
               ↓
               Split content
            */

            const top = landscape ? h * .10 : h * .07;

            /* ================= BRAND ================= */

            ctx.save();

            ctx.textAlign = "left";
            ctx.textBaseline = "middle";

            const brandSize =
                Math.max(22,
                    Math.min(72, minSide * .045));

            ctx.font = `900 ${brandSize}px Montserrat`;

            ctx.fillStyle = "#fff";

            ctx.shadowColor = currentTheme.cyan;
            ctx.shadowBlur = 18;

            ctx.fillText(
                "4X",
                w * .055,
                top
            );

            ctx.shadowBlur = 0;

            const brandSmall =
                Math.max(12, brandSize * .42);

            ctx.font = `900 ${brandSmall}px Montserrat`;

            ctx.fillStyle = "#fff";

            ctx.fillText(
                data.brand,
                w * .055,
                top + brandSize * .65
            );

            ctx.restore();


            /* ================= TOP TITLE ================= */

            let titleSize =
                landscape
                    ? minSide * .095
                    : minSide * .115;

            titleSize = Math.max(38, titleSize);

            const titleX = w / 2;

            const dontY =
                landscape
                    ? h * .17
                    : h * .17;

            const sayY =
                landscape
                    ? h * .30
                    : h * .285;


            /* DON'T SAY */

            ctx.save();

            ctx.translate(
                titleX,
                dontY + yOffset * .20
            );

            ctx.rotate(-3 * Math.PI / 180);

            ctx.font = `900 ${titleSize}px Montserrat`;

            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            ctx.shadowColor = currentTheme.red;
            ctx.shadowBlur = 35;

            ctx.fillStyle = currentTheme.red;

            ctx.fillText(
                "DON'T SAY ✕",
                0,
                0
            );

            ctx.shadowBlur = 8;

            ctx.strokeStyle = "#000";
            ctx.lineWidth = titleSize * .055;

            ctx.strokeText(
                "DON'T SAY ✕",
                0,
                0
            );

            ctx.fillStyle = "#fff";

            ctx.fillText(
                "DON'T SAY ✕",
                0,
                0
            );

            ctx.restore();


            /* SAY THIS */

            ctx.save();

            ctx.translate(
                titleX,
                sayY + yOffset * .20
            );

            ctx.rotate(-3 * Math.PI / 180);

            ctx.font = `900 ${titleSize}px Montserrat`;

            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            ctx.shadowColor = currentTheme.green;
            ctx.shadowBlur = 35;

            ctx.fillStyle = currentTheme.green;

            ctx.fillText(
                "SAY THIS ✓",
                0,
                0
            );

            ctx.shadowBlur = 8;

            ctx.strokeStyle = "#000";
            ctx.lineWidth = titleSize * .055;

            ctx.strokeText(
                "SAY THIS ✓",
                0,
                0
            );

            ctx.fillStyle = "#fff";

            ctx.fillText(
                "SAY THIS ✓",
                0,
                0
            );

            ctx.restore();


            /* ================= HOOK ================= */

            const hookY =
                landscape
                    ? h * .41
                    : h * .375;

            const hookWidth = w * .72;

            drawLabel(
                data.hook,
                w / 2,
                hookY + yOffset * .35,
                hookWidth,
                currentTheme.laser
            );


            /* ================= LASER ================= */

            drawLaser(w, h);


            /*
               ================= CONTENT ZONES =================
        
               Left card = Wrong
               Right card = Right
        
               These are independent.
               No overlap.
            */

            const contentY =
                landscape
                    ? h * .64
                    : h * .61;

            const leftX =
                landscape
                    ? w * .28
                    : w * .27;

            const rightX =
                landscape
                    ? w * .72
                    : w * .73;


            const cardW =
                landscape
                    ? w * .39
                    : w * .40;

            const cardH =
                landscape
                    ? h * .43
                    : h * .30;


            /* ================= LEFT CARD ================= */

            drawCard(
                leftX,
                contentY + yOffset,
                cardW,
                cardH,
                currentTheme.red,
                "WRONG"
            );

            drawCross(
                leftX,
                contentY - cardH * .30 + yOffset,
                minSide * .11,
                currentTheme.red
            );


            /* ================= RIGHT CARD ================= */

            drawCard(
                rightX,
                contentY + yOffset,
                cardW,
                cardH,
                currentTheme.green,
                "CORRECT"
            );

            drawCheck(
                rightX,
                contentY - cardH * .30 + yOffset,
                minSide * .115,
                currentTheme.green
            );


            /* ================= SENTENCES ================= */

            const sentenceMax =
                cardW * .80;

            const sentenceSize =
                landscape
                    ? minSide * .065
                    : minSide * .072;


            drawCenteredText(
                data.wrong,
                leftX,
                contentY + cardH * .05 + yOffset,
                sentenceMax,
                sentenceSize,
                "#fff",
                currentTheme.red
            );


            drawCenteredText(
                data.right,
                rightX,
                contentY + cardH * .05 + yOffset,
                sentenceMax,
                sentenceSize,
                "#fff",
                currentTheme.green
            );


            /* ================= FOOTER ================= */

            ctx.save();

            const footerY = h * .94;

            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            const footerSize =
                Math.max(16, minSide * .025);

            ctx.font = `900 ${footerSize}px Montserrat`;

            ctx.fillStyle = "rgba(255,255,255,.72)";

            ctx.fillText(
                "FOLLOW 4X LEARNER • DAILY ENGLISH",
                w / 2,
                footerY
            );

            ctx.restore();


            /* ================= VIGNETTE ================= */

            const vignette = ctx.createRadialGradient(
                w / 2,
                h / 2,
                Math.min(w, h) * .25,
                w / 2,
                h / 2,
                Math.max(w, h) * .72
            );

            vignette.addColorStop(
                0,
                "transparent"
            );

            vignette.addColorStop(
                1,
                "rgba(0,0,0,.48)"
            );

            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, w, h);

        }


        /* =========================================================
           CONTENT CARD
        ========================================================= */

        function drawCard(x, y, w, h, color, label) {

            ctx.save();

            ctx.translate(x, y);

            ctx.rotate(-3 * Math.PI / 180);

            const rx = -w / 2;
            const ry = -h / 2;

            /* shadow */

            ctx.shadowColor = "rgba(0,0,0,.85)";
            ctx.shadowBlur = Math.max(20, w * .08);
            ctx.shadowOffsetY = w * .025;

            ctx.fillStyle = "rgba(5,8,15,.88)";

            roundRect(
                ctx,
                rx,
                ry,
                w,
                h,
                Math.min(30, w * .06)
            );

            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;

            /* border */

            ctx.strokeStyle = color;
            ctx.globalAlpha = .75;
            ctx.lineWidth = Math.max(3, w * .007);

            roundRect(
                ctx,
                rx,
                ry,
                w,
                h,
                Math.min(30, w * .06)
            );

            ctx.stroke();

            /* top glow line */

            ctx.globalAlpha = 1;

            const grad = ctx.createLinearGradient(
                rx, 0,
                rx + w, 0
            );

            grad.addColorStop(0, "transparent");
            grad.addColorStop(.5, color);
            grad.addColorStop(1, "transparent");

            ctx.fillStyle = grad;

            roundRect(
                ctx,
                rx + w * .12,
                ry + w * .025,
                w * .76,
                Math.max(5, w * .012),
                10
            );

            ctx.fill();

            /* label */

            ctx.fillStyle = color;

            ctx.font =
                `900 ${Math.max(15, w * .038)}px Montserrat`;

            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            ctx.fillText(
                label,
                0,
                ry + h * .17
            );

            ctx.restore();

        }


        /* =========================================================
           PNG EXPORT
        ========================================================= */

        function downloadPNG() {

            render();

            toast(
                "Rendering " + currentWidth + " × " + currentHeight + " PNG..."
            );

            setTimeout(() => {

                canvas.toBlob(
                    blob => {

                        if (!blob) {

                            toast("PNG export failed");
                            return;

                        }

                        const url =
                            URL.createObjectURL(blob);

                        const a =
                            document.createElement("a");

                        a.href = url;

                        a.download =
                            `4X_LEARNER_${currentWidth}x${currentHeight}_${Date.now()}.png`;

                        document.body.appendChild(a);

                        a.click();

                        a.remove();

                        setTimeout(
                            () => URL.revokeObjectURL(url),
                            2000
                        );

                        toast(
                            "PNG downloaded: " +
                            currentWidth + " × " + currentHeight
                        );

                    },
                    "image/png"
                );

            }, 80);

        }


        /* =========================================================
           COPY
        ========================================================= */

        function copyScript() {

            const text =
                `DON'T SAY ✕
${data.wrong}

SAY THIS ✓
${data.right}

${data.hook}

4X LEARNER`;

            if (navigator.clipboard) {

                navigator.clipboard.writeText(text);

            }

            toast("Content copied");

        }


        /* =========================================================
           TOAST
        ========================================================= */

        let toastTimer;

        function toast(message) {

            const el = document.getElementById("toast");

            el.textContent = message;

            el.style.display = "block";

            clearTimeout(toastTimer);

            toastTimer = setTimeout(() => {

                el.style.display = "none";

            }, 2200);

        }


        /* =========================================================
           INITIAL
        ========================================================= */

        window.addEventListener("load", () => {

            loadSample();

            updatePreviewRatio();

        });

        window.addEventListener("resize", () => {

            updatePreviewRatio();

        });

    </script>
