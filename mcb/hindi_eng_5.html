    <style>
        :root {
            --bg: #060b13;
            --panel: rgba(17, 26, 46, 0.95);
            --border: rgba(255, 255, 255, 0.12);
            --accent: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 50% 0%, #0c1a30 0%, var(--bg) 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            overflow-x: hidden;
        }

        .app-wrapper {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 440px;
            align-items: center;
        }

        @media (min-width: 992px) {
            .app-wrapper {
                max-width: 1120px;
                flex-direction: row;
                align-items: flex-start;
                justify-content: center;
                gap: 24px;
            }
        }

        /* 9:16 Shorts/Reels Canvas Frame */
        .preview-viewport {
            width: 100%;
            max-width: 380px;
            background: #111a2e;
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 12px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        canvas {
            width: 100%;
            aspect-ratio: 9/16;
            border-radius: 20px;
            background: #000;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9);
            display: block;
        }

        /* Mobile Control Deck */
        .control-panel {
            width: 100%;
            max-width: 380px;
            background: #111a2e;
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 26px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
        }

        @media (min-width: 992px) {
            .control-panel {
                max-width: 520px;
                height: calc(100vh - 40px);
                overflow-y: auto;
            }
        }

        .control-panel::-webkit-scrollbar {
            width: 5px;
        }

        .control-panel::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1f2f52;
            padding-bottom: 10px;
        }

        .panel-header h2 {
            font-size: 1.15rem;
            font-weight: 900;
            color: #38bdf8;
            letter-spacing: -0.5px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 0.74rem;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        textarea,
        input,
        select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #080d18;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
            transition: all 0.2s ease;
        }

        textarea:focus,
        input:focus,
        select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
        }

        textarea {
            height: 120px;
            resize: vertical;
            line-height: 1.45;
            font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', sans-serif;
            font-size: 0.82rem;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        .input-row>div {
            flex: 1;
        }

        .btn-deck {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 6px;
        }

        .btn-ui {
            padding: 13px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 0.8rem;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
            text-transform: uppercase;

            font-size: 0.92rem;
            border: none;
            box-shadow: 0 6px 20px rgba(225, 29, 72, 0.45);

</head>

<body>

2. Beat around the bush = घुमा-फिराकर बात करना

    <script>

        const baseThemeList = [

                    { bg: "#0284c7", numBg: "#e0f2fe", numTxt: "#0284c7", enTxt: "#ffffff", hiTxt: "#fef08a" }
                ]
            },
            {
                bgStart: "#1e293b", bgEnd: "#020617",
                qTitle: "#38bdf8", cardBg: "#ffffff", ctaCol: "#38bdf8",
                starCol: "#f59e0b",
                rows: [
                    { bg: "#2563eb", numBg: "#dbeafe", numTxt: "#1e40af", enTxt: "#ffffff", hiTxt: "#fef08a" },
                    { bg: "#0284c7", numBg: "#e0f2fe", numTxt: "#0369a1", enTxt: "#ffffff", hiTxt: "#fef08a" },
                    { bg: "#0d9488", numBg: "#ccfbf1", numTxt: "#0f766e", enTxt: "#ffffff", hiTxt: "#fef08a" },
                    { bg: "#7c3aed", numBg: "#ede9fe", numTxt: "#5b21b6", enTxt: "#ffffff", hiTxt: "#fef08a" },
                    { bg: "#ea580c", numBg: "#ffedd5", numTxt: "#c2410c", enTxt: "#ffffff", hiTxt: "#fef08a" }
                ]
            },
            {
                bgStart: "#1c2541", bgEnd: "#050814",
                qTitle: "#48cae4", cardBg: "rgba(240, 248, 255, 0.96)", ctaCol: "#48cae4",
                starCol: "#00b4d8",
                rows: [
                    { bg: "#0284c7", numBg: "#e0f2fe", numTxt: "#0284c7", enTxt: "#ffffff", hiTxt: "#fef08a" },
                    { bg: "#0369a1", numBg: "#bae6fd", numTxt: "#0369a1", enTxt: "#ffffff", hiTxt: "#fef08a" },
                    { bg: "#0f766e", numBg: "#ccfbf1", numTxt: "#0f766e", enTxt: "#ffffff", hiTxt: "#fef08a" },
                    { bg: "#4f46e5", numBg: "#e0e7ff", numTxt: "#4338ca", enTxt: "#ffffff", hiTxt: "#fef08a" },
                    { bg: "#0891b2", numBg: "#cffafe", numTxt: "#0e7490", enTxt: "#ffffff", hiTxt: "#fef08a" }
                ]
            },
            {
                bgStart: "#4a0e22", bgEnd: "#140207",
                qTitle: "#fbbf24", cardBg: "#fff5f5", ctaCol: "#fbbf24",
                starCol: "#f43f5e",
                rows: [
                    { bg: "#e11d48", numBg: "#ffe4e6", numTxt: "#be123c", enTxt: "#ffffff", hiTxt: "#fef08a" },
                    { bg: "#ea580c", numBg: "#ffedd5", numTxt: "#c2410c", enTxt: "#ffffff", hiTxt: "#fef08a" },
                    { bg: "#d97706", numBg: "#fef3c7", numTxt: "#b45309", enTxt: "#ffffff", hiTxt: "#fef08a" },
                    { bg: "#be123c", numBg: "#ffe4e6", numTxt: "#9f1239", enTxt: "#ffffff", hiTxt: "#fef08a" },
                    { bg: "#9333ea", numBg: "#f3e8ff", numTxt: "#7e22ce", enTxt: "#ffffff", hiTxt: "#fef08a" }
                ]
            },
            {
                bgStart: "#3b1454", bgEnd: "#0d0314",
                qTitle: "#f472b6", cardBg: "#faf5ff", ctaCol: "#f472b6",
                starCol: "#d946ef",
                rows: [
                    { bg: "#9333ea", numBg: "#f3e8ff", numTxt: "#7e22ce", enTxt: "#ffffff", hiTxt: "#fef08a" },
                    { bg: "#c026d3", numBg: "#fae8ff", numTxt: "#a21caf", enTxt: "#ffffff", hiTxt: "#fef08a" },
                    { bg: "#db2777", numBg: "#fce7f3", numTxt: "#be185d", enTxt: "#ffffff", hiTxt: "#fef08a" },
                    { bg: "#6366f1", numBg: "#e0e7ff", numTxt: "#4338ca", enTxt: "#ffffff", hiTxt: "#fef08a" },
                    { bg: "#06b6d4", numBg: "#cffafe", numTxt: "#0891b2", enTxt: "#ffffff", hiTxt: "#fef08a" }
                ]
            }
        ];

        const themes = [];
        for (let i = 1; i <= 50; i++) {
            const fontObj = fontPairs[(i - 1) % fontPairs.length];
            const baseT = baseThemeList[(i - 1) % baseThemeList.length];
            themes.push({
                name: `${i < 10 ? '0' + i : i}. ${fontObj.name} [Style ${i}]`,
                font: fontObj,
                ...baseT
            });
        }

        const themeSelect = document.getElementById("themeSelect");
        themes.forEach((th, idx) => {
            const opt = document.createElement("option");
            opt.value = idx;
            opt.innerText = th.name;
            themeSelect.appendChild(opt);
        });

        const landingSelect = document.getElementById("landingSelect");
        const landingBase = [
            "Hyper Elastic Drop", "Radial Pop Burst", "Kinetic Left In",
            "Kinetic Right In", "3D Flip Land", "Vortex Twirl In",
            "Fast Snap Blur In", "Skew Horizon Glide", "Smooth Float Fall", "Zoom Slide Snappy"
        ];
        for (let i = 1; i <= 60; i++) {
            const opt = document.createElement("option");
            opt.value = i - 1;
            opt.innerText = `Preset #${i < 10 ? '0' + i : i} - ${landingBase[(i - 1) % landingBase.length]} [FX ${i}]`;
            landingSelect.appendChild(opt);
        }

        const canvas = document.getElementById("posterCanvas");
        const ctx = canvas.getContext("2d");

        function parseRawInput() {
            const text = document.getElementById("rawInput").value.trim();
            const defaultList = [
                { num: "1", en: "Hit the sack", hi: "सोने जाना (Go to sleep)" },
                { num: "2", en: "Beat around the bush", hi: "घुमा-फिराकर बात करना" },
                { num: "3", en: "Bite the bullet", hi: "मजबूरी में कठिन फैसला लेना" },
                { num: "4", en: "Under the weather", hi: "तबीयत थोड़ी खराब होना" },
                { num: "5", en: "Call it a day", hi: "आज का काम खत्म करना" }
            ];
            if (!text) return defaultList;

            const lines = text.split("\n").map(l => l.trim()).filter(l => l.length > 0);
            const parsed = [];

            for (let i = 0; i < 5; i++) {
                if (lines[i]) {
                    let clean = lines[i].replace(/^\d+[\.\)\:\-\s]+/, "");
                    let parts = clean.split(/[=\-\:]+/);
                    let en = (parts[0] || "").trim();
                    let hi = (parts[1] || "").trim();
                    parsed.push({ num: String(i + 1), en: en || `Phrase ${i + 1}`, hi: hi || `अर्थ ${i + 1}` });
                } else {
                    parsed.push(defaultList[i]);
                }
            }
            return parsed;
        }

        function roundRect(ctx, x, y, w, h, r, fill, stroke) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            if (fill) ctx.fill();
            if (stroke) ctx.stroke();
        }

        function drawGlowingStar(ctx, cx, cy, spikes, outerRadius, innerRadius, color) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 18;
            ctx.fill();
            ctx.restore();
        }

        function renderScene(landingProg = 1.0) {
            const th = themes[themeSelect.value];
            const items = parseRawInput();
            const titleText = document.getElementById("titleInput").value;
            const subCatText = document.getElementById("subCatInput").value;
            const ctaText = document.getElementById("ctaInput").value;
            const handleText = document.getElementById("handleInput").value;
            const landingMode = parseInt(landingSelect.value, 10) % 8;

            ctx.clearRect(0, 0, 1080, 1920);

            // 1. Blackboard Background
            const grad = ctx.createRadialGradient(540, 400, 80, 540, 960, 1250);
            grad.addColorStop(0, th.bgStart);
            grad.addColorStop(0.7, th.bgEnd);
            grad.addColorStop(1, "#010609");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1080, 1920);

            // Chalkboard Texture Dots
            ctx.fillStyle = "rgba(255, 255, 255, 0.04)";
            for (let px = 40; px < 1080; px += 60) {
                for (let py = 40; py < 1920; py += 60) {
                    ctx.fillRect(px, py, 2.5, 2.5);
                }
            }

            // Top Ambient Star Accents
            drawGlowingStar(ctx, 950, 140, 4, 30, 14, th.starCol);
            drawGlowingStar(ctx, 1000, 200, 4, 18, 8, "#fef08a");
            drawGlowingStar(ctx, 900, 220, 4, 15, 7, th.starCol);

            // 2. Top Header Brand & Badge
            const hEase = 1 - Math.pow(1 - Math.min(1, landingProg / 0.35), 3);
            ctx.save();
            ctx.globalAlpha = Math.min(1, landingProg / 0.35);
            ctx.translate(0, (1 - hEase) * -160);

            // 4X LEARNER Glass Badge
            ctx.fillStyle = "rgba(255, 255, 255, 0.1)";
            ctx.strokeStyle = "rgba(255, 255, 255, 0.22)";
            ctx.lineWidth = 2.5;
            ctx.shadowColor = "rgba(0, 0, 0, 0.3)";
            ctx.shadowBlur = 18;
            roundRect(ctx, 80, 95, 420, 88, 20, true, true);

            const bGrad = ctx.createLinearGradient(94, 107, 194, 171);
            bGrad.addColorStop(0, "#ef4444");
            bGrad.addColorStop(1, "#f97316");
            ctx.fillStyle = bGrad;
            roundRect(ctx, 94, 107, 96, 64, 16, true, false);

            ctx.fillStyle = "#ffffff";
            ctx.font = `900 40px 'Montserrat', sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("4X", 142, 139);

            ctx.fillStyle = "#ffffff";
            ctx.font = `900 34px 'Montserrat', sans-serif`;
            ctx.textAlign = "left";
            ctx.fillText("LEARNER", 212, 139);

            // English Mastery Pill
            roundRect(ctx, 1080 - 430, 95, 350, 88, 44, "rgba(255, 255, 255, 0.12)", "rgba(255, 255, 255, 0.25)");
            ctx.fillStyle = "#facc15";
            ctx.font = "800 28px 'Inter', sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(`⚡ DAILY TALK`, 1080 - 255, 139);
            ctx.restore();

            // 3. Title & Category Heading
            const tEase = 1 - Math.pow(1 - Math.min(1, Math.max(0, (landingProg - 0.08) / 0.4)), 3);
            ctx.save();
            ctx.globalAlpha = Math.min(1, Math.max(0, (landingProg - 0.08) / 0.4));
            ctx.translate(0, (1 - tEase) * -60);

            ctx.fillStyle = th.qTitle;
            ctx.font = `800 68px ${th.font.title}, sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowColor = "rgba(0, 0, 0, 0.6)";
            ctx.shadowBlur = 18;
            ctx.fillText(titleText, 540, 240);

            ctx.fillStyle = "#38bdf8";
            ctx.font = `800 30px 'Inter', sans-serif`;
            ctx.fillText(subCatText.toUpperCase(), 540, 305);
            ctx.restore();

            // 4. Central Card
            const cProg = Math.min(1, Math.max(0, (landingProg - 0.12) / 0.45));
            const cEase = 1 - Math.pow(1 - cProg, 3);
            const cardX = 80;
            const cardY = 350;
            const cardW = 920;
            const cardH = 1220;

            ctx.save();
            ctx.globalAlpha = cProg;

            if (landingMode === 1) {
                const s = 0.2 + 0.8 * cEase;
                ctx.translate(540 * (1 - s), 960 * (1 - s));
                ctx.scale(s, s);
            } else if (landingMode === 2) {
                ctx.translate((1 - cEase) * -700, 0);
            } else if (landingMode === 3) {
                ctx.translate((1 - cEase) * 700, 0);
            } else {
                ctx.translate(0, (1 - cEase) * 200);
            }

            // White Card Body
            ctx.fillStyle = th.cardBg;
            ctx.shadowColor = "rgba(0, 0, 0, 0.45)";
            ctx.shadowBlur = 40;
            roundRect(ctx, cardX, cardY, cardW, cardH, 44, true, false);

            // 5 Word Rows Stack
            const rowYStart = cardY + 45;
            const rowH = 205;
            const rowGap = 24;
            const rowW = cardW - 70;
            const rowX = cardX + 35;

            items.forEach((item, idx) => {
                const y = rowYStart + idx * (rowH + rowGap);
                const rowStyle = th.rows[idx % th.rows.length];

                const oProg = Math.min(1, Math.max(0, (landingProg - (0.2 + idx * 0.12)) / 0.4));
                const oEase = 1 - Math.pow(1 - oProg, 3);
                const currX = rowX + (1 - oEase) * (idx % 2 === 0 ? -600 : 600);

                ctx.save();
                ctx.globalAlpha = oProg;
                ctx.translate(currX - rowX, 0);

                // Row Container
                ctx.fillStyle = rowStyle.bg;
                ctx.shadowColor = "rgba(0, 0, 0, 0.2)";
                ctx.shadowBlur = 16;
                roundRect(ctx, rowX, y, rowW, rowH, 26, true, false);

                // Number Box
                const bSize = 130;
                const bPad = 26;
                ctx.fillStyle = rowStyle.numBg;
                roundRect(ctx, rowX + bPad, y + (rowH - bSize) / 2, bSize, bSize, 22, true, false);

                ctx.fillStyle = rowStyle.numTxt;
                ctx.font = `900 68px ${th.font.title}, sans-serif`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(item.num, rowX + bPad + bSize / 2, y + rowH / 2);

                // English Text (Advanced Phrase)
                const textStartX = rowX + bPad + bSize + 32;
                ctx.fillStyle = rowStyle.enTxt;
                ctx.font = `900 50px ${th.font.title}, sans-serif`;
                ctx.textAlign = "left";
                ctx.textBaseline = "middle";
                ctx.shadowBlur = 0;
                ctx.fillText(item.en, textStartX, y + 65);

                // Hindi Meaning
                ctx.fillStyle = rowStyle.hiTxt;
                ctx.font = `800 40px 'Noto Sans Devanagari', sans-serif`;
                ctx.fillText(item.hi, textStartX, y + 140);

                ctx.restore();
            });

            ctx.restore();

            // 5. Bottom CTA Text
            ctx.save();
            ctx.globalAlpha = Math.min(1, landingProg);
            ctx.fillStyle = th.ctaCol;
            ctx.font = `800 34px ${th.font.main}, sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowColor = "rgba(0,0,0,0.6)";
            ctx.shadowBlur = 10;
            ctx.fillText(ctaText, 540, 1615);
            ctx.restore();

            // 6. Safe-Zone Footer Official Bar
            ctx.save();
            ctx.globalAlpha = Math.min(1, landingProg);
            const footY = 1700;
            const footW = 960;
            const footH = 92;
            const footX = 540 - footW / 2;

            ctx.fillStyle = "#ffffff";
            roundRect(ctx, footX, footY, footW, footH, 46, true, false);

            ctx.fillStyle = "#0f172a";
            ctx.font = `900 32px 'Montserrat', sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(`OFFICIAL : ▶ ${handleText}   📷 4xlearner.official   f 4xlearner`, 540, footY + footH / 2);
            ctx.restore();
        }

        // Live Fast Landing Animation Loop
        function runFastLandingAnimation() {
            let start = null;
            const duration = 1300;

            function step(timestamp) {
                if (!start) start = timestamp;
                const elapsed = timestamp - start;
                const progress = Math.min(1.0, elapsed / duration);

                renderScene(progress);

                if (progress < 1.0) {
                    requestAnimationFrame(step);
                }
            }
            requestAnimationFrame(step);
        }

        function resetState() {
            runFastLandingAnimation();
        }

        // 4K PNG Download
        function downloadImage() {
            renderScene(1.0);
            const a = document.createElement("a");
            a.download = `4X_LEARNER_Advanced_English_${Date.now()}.png`;
            a.href = canvas.toDataURL("image/png", 1.0);
            a.click();
        }

        // 60FPS Video Export
        function exportReelsVideo() {
            const btn = document.getElementById("recordBtn");
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Rendering 60FPS Video...`;
            btn.disabled = true;

            const stream = canvas.captureStream(60);
            const recorder = new MediaRecorder(stream, {
                mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm'
            });
            const chunks = [];

            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `4X_LEARNER_AdvEnglish_Reel_${Date.now()}.webm`;
                a.click();
                btn.innerHTML = `<i class="fa-solid fa-video"></i> Export 1080x1920 60FPS Video`;
                btn.disabled = false;
            };

            recorder.start();

            const TOTAL_DURATION = 4200;
            const startTime = performance.now();

            function step(now) {
                const elapsed = now - startTime;
                const progress = Math.min(1.0, elapsed / 1400);

                renderScene(progress);

                if (elapsed < TOTAL_DURATION) {
                    requestAnimationFrame(step);
                } else {
                    recorder.stop();
                }
            }
            requestAnimationFrame(step);
        }

        // Event Listeners
        [
            "themeSelect", "titleInput", "subCatInput",
            "ctaInput", "handleInput", "rawInput"
        ].forEach(id => {
            document.getElementById(id).addEventListener("input", () => renderScene(1.0));
        });

        document.getElementById("landingSelect").addEventListener("change", runFastLandingAnimation);

        // Initial Load
        renderScene(1.0);
        runFastLandingAnimation();
    </script>
</body>
