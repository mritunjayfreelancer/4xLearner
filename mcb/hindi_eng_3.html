<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>4X LEARNER - Top 5 Vocab Studio PRO</title>

    <!-- Google Fonts including Hindi Devanagari Support -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Fredoka:wght@600;700&family=Inter:wght@600;700;800;900&family=Lexend:wght@700;800;900&family=Montserrat:wght@800;900&family=Noto+Sans+Devanagari:wght@700;800;900&family=Outfit:wght@700;900&family=Plus+Jakarta+Sans:wght@700;800;900&family=Poppins:wght@700;800;900&family=Righteous&family=Rubik:wght@700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        :root {
            --bg: #030712;
            --panel: rgba(15, 23, 42, 0.95);
            --border: rgba(255, 255, 255, 0.12);
            --accent: #ff6e26;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 50% 0%, #0f172a 0%, var(--bg) 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            overflow-x: hidden;
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 440px;
            align-items: center;
        }

        @media (min-width: 992px) {
            .main-wrapper {
                max-width: 1120px;
                flex-direction: row;
                align-items: flex-start;
                justify-content: center;
                gap: 24px;
            }
        }

        /* 9:16 Shorts/Reels Viewport */
        .preview-viewport {
            width: 100%;
            max-width: 380px;
            background: #111827;
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 12px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        canvas {
            width: 100%;
            aspect-ratio: 9/16;
            border-radius: 20px;
            background: #000;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9);
            display: block;
        }

        .control-panel {
            width: 100%;
            max-width: 380px;
            background: #111827;
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 26px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
        }

        @media (min-width: 992px) {
            .control-panel {
                max-width: 520px;
                height: calc(100vh - 40px);
                overflow-y: auto;
            }
        }

        .control-panel::-webkit-scrollbar {
            width: 5px;
        }

        .control-panel::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1f293d;
            padding-bottom: 10px;
        }

        .panel-header h2 {
            font-size: 1.15rem;
            font-weight: 900;
            color: #ff8a3d;
            letter-spacing: -0.5px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 0.74rem;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        textarea,
        input,
        select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #090e1a;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
            transition: all 0.2s ease;
        }

        textarea:focus,
        input:focus,
        select:focus {
            border-color: #ff8a3d;
            box-shadow: 0 0 12px rgba(255, 110, 38, 0.35);
        }

        textarea {
            height: 125px;
            resize: vertical;
            line-height: 1.45;
            font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', sans-serif;
            font-size: 0.84rem;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        .input-row>div {
            flex: 1;
        }

        .btn-deck {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 6px;
        }

        .btn-ui {
            padding: 13px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 0.8rem;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn-ui:active {
            transform: scale(0.97);
        }

        .btn-preview {
            background: #1e293b;
            color: #ff8a3d;
            border-color: #ff8a3d;
        }

        .btn-download {
            background: linear-gradient(135deg, #ff8a3d, #ff5400);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 15px rgba(255, 84, 0, 0.4);
        }

        .btn-video {
            background: linear-gradient(135deg, #e11d48, #be123c);
            color: #ffffff;
            grid-column: span 2;
            padding: 14px;
            font-size: 0.92rem;
            border: none;
            box-shadow: 0 6px 20px rgba(225, 29, 72, 0.45);
        }
    </style>
</head>

<body>

    <div class="main-wrapper">
        <div class="preview-viewport">
            <canvas id="posterCanvas" width="1080" height="1920"></canvas>
        </div>

        <div class="control-panel">
            <div class="panel-header">
                <h2>⚡ 4X LEARNER VOCAB STUDIO</h2>
                <span
                    style="font-size:0.68rem; background:rgba(255,110,38,0.2); color:#ff8a3d; padding:3px 7px; border-radius:6px; font-weight:900;">1080x1920
                    REELS</span>
            </div>

            <div class="field-group">
                <label>🎨 3D Color Themes</label>
                <select id="themeSelect"></select>
            </div>

            <div class="field-group">
                <label>⚡ Fast Landing FX</label>
                <select id="landingSelect"></select>
            </div>

            <div class="input-row">
                <div>
                    <label>Top Pill Title</label>
                    <input type="text" id="headerPillInput" value="TOP 5 DAILY WORDS">
                </div>
                <div>
                    <label>Subject Label</label>
                    <input type="text" id="subjectLabelInput" value="ENGLISH TO HINDI">
                </div>
            </div>

            <div class="field-group">
                <label>Main Topic Heading</label>
                <input type="text" id="subjectTitleInput" value="DAILY USE VOCABULARY">
            </div>

            <div class="field-group">
                <label>Top 5 Items (English = Hindi)</label>
                <textarea id="rawInput">1. Meticulous = बहुत सावधान / सूक्ष्म
2. Diligent = मेहनती / परिश्रमी
3. Reluctant = अनिच्छुक / हिचकिचाने वाला
4. Authentic = असली / प्रामाणिक
5. Compassion = दया / सहानुभूति</textarea>
            </div>

            <div class="input-row">
                <div>
                    <label>CTA Badge</label>
                    <input type="text" id="commentCtaInput" value="SAVE & SHARE">
                </div>
                <div>
                    <label>Channel Tag</label>
                    <input type="text" id="socialInput" value="@4xlearner">
                </div>
            </div>

            <div class="btn-deck">
                <button class="btn-ui btn-preview" onclick="runFastLandingAnimation()"><i class="fa-solid fa-play"></i>
                    Play Animation</button>
                <button class="btn-ui btn-download" onclick="downloadImage()"><i class="fa-solid fa-image"></i> HD
                    PNG</button>
                <button class="btn-ui btn-video" id="recordBtn" onclick="exportReelsVideo()"><i
                        class="fa-solid fa-video"></i> Export 1080x1920 60FPS Video</button>
            </div>
        </div>
    </div>

    <script>
        const fontsPool = [
            { main: "'Plus Jakarta Sans', 'Noto Sans Devanagari', sans-serif", title: "'Fredoka', cursive", name: "Modern Pop" },
            { main: "'Inter', 'Noto Sans Devanagari', sans-serif", title: "'Righteous', cursive", name: "Bold Punch" },
            { main: "'Outfit', 'Noto Sans Devanagari', sans-serif", title: "'Rubik', sans-serif", name: "Clean Vibrant" },
            { main: "'Montserrat', 'Noto Sans Devanagari', sans-serif", title: "'Montserrat', sans-serif", name: "Urban Tech" },
            { main: "'Poppins', 'Noto Sans Devanagari', sans-serif", title: "'Lexend', sans-serif", name: "Lexend Clean" }
        ];

        const baseThemeList = [
            {
                bg: "#0f172a", cardBorder: "#ff6e26", cardBg: "#ffffff",
                headerGrad: ["#ff8a3d", "#ff5400"],
                subLabel: "#ff5400", subName: "#0f172a",
                rows: [
                    { bg: ["#ff7a29", "#ea580c"], numBg: "#fff", numTxt: "#ea580c" },
                    { bg: ["#0284c7", "#0369a1"], numBg: "#fff", numTxt: "#0284c7" },
                    { bg: ["#10b981", "#059669"], numBg: "#fff", numTxt: "#059669" },
                    { bg: ["#8b5cf6", "#6d28d9"], numBg: "#fff", numTxt: "#6d28d9" },
                    { bg: ["#ec4899", "#be185d"], numBg: "#fff", numTxt: "#be185d" }
                ],
                footerBg: "#1e293b"
            },
            {
                bg: "#1e1b4b", cardBorder: "#6366f1", cardBg: "#f8fafc",
                headerGrad: ["#8b5cf6", "#ec4899"],
                subLabel: "#6366f1", subName: "#0f172a",
                rows: [
                    { bg: ["#6366f1", "#4f46e5"], numBg: "#fff", numTxt: "#4f46e5" },
                    { bg: ["#06b6d4", "#0891b2"], numBg: "#fff", numTxt: "#0891b2" },
                    { bg: ["#f59e0b", "#d97706"], numBg: "#fff", numTxt: "#d97706" },
                    { bg: ["#10b981", "#047857"], numBg: "#fff", numTxt: "#047857" },
                    { bg: ["#e11d48", "#be123c"], numBg: "#fff", numTxt: "#be123c" }
                ],
                footerBg: "#312e81"
            },
            {
                bg: "#064e3b", cardBorder: "#10b981", cardBg: "#f0fdf4",
                headerGrad: ["#34d399", "#059669"],
                subLabel: "#059669", subName: "#064e3b",
                rows: [
                    { bg: ["#059669", "#047857"], numBg: "#fff", numTxt: "#047857" },
                    { bg: ["#0d9488", "#0f766e"], numBg: "#fff", numTxt: "#0f766e" },
                    { bg: ["#0284c7", "#0369a1"], numBg: "#fff", numTxt: "#0369a1" },
                    { bg: ["#f97316", "#c2410c"], numBg: "#fff", numTxt: "#c2410c" },
                    { bg: ["#8b5cf6", "#6d28d9"], numBg: "#fff", numTxt: "#6d28d9" }
                ],
                footerBg: "#022c22"
            }
        ];

        const themes = [];
        for (let i = 1; i <= 20; i++) {
            const fontObj = fontsPool[(i - 1) % fontsPool.length];
            const baseT = baseThemeList[(i - 1) % baseThemeList.length];
            themes.push({
                name: `Theme ${i < 10 ? '0' + i : i} - ${fontObj.name}`,
                font: fontObj,
                ...baseT
            });
        }

        const themeSelect = document.getElementById("themeSelect");
        themes.forEach((th, idx) => {
            const opt = document.createElement("option");
            opt.value = idx;
            opt.innerText = th.name;
            themeSelect.appendChild(opt);
        });

        const landingSelect = document.getElementById("landingSelect");
        const landingModes = ["Slide Stagger In", "Radial Pop Scale", "Alternate Left-Right", "Elastic Smooth Drop"];
        landingModes.forEach((name, idx) => {
            const opt = document.createElement("option");
            opt.value = idx;
            opt.innerText = name;
            landingSelect.appendChild(opt);
        });

        const canvas = document.getElementById("posterCanvas");
        const ctx = canvas.getContext("2d");

        function parseRawInput() {
            const text = document.getElementById("rawInput").value.trim();
            const defaultList = [
                { num: "1", en: "Meticulous", hi: "बहुत सावधान" },
                { num: "2", Diligent: "Diligent", hi: "मेहनती" },
                { num: "3", en: "Reluctant", hi: "अनिच्छुक" },
                { num: "4", en: "Authentic", hi: "असली" },
                { num: "5", en: "Compassion", hi: "सहानुभूति" }
            ];
            if (!text) return defaultList;

            const lines = text.split("\n").map(l => l.trim()).filter(l => l.length > 0);
            const parsed = [];

            for (let i = 0; i < 5; i++) {
                if (lines[i]) {
                    let clean = lines[i].replace(/^\d+[\.\)\:\-\s]+/, "");
                    let parts = clean.split(/[=\-\:]+/);
                    let en = (parts[0] || "").trim();
                    let hi = (parts[1] || "").trim();
                    parsed.push({ num: String(i + 1), en: en || `Word ${i + 1}`, hi: hi || `अर्थ ${i + 1}` });
                } else {
                    parsed.push(defaultList[i]);
                }
            }
            return parsed;
        }

        function roundRect(ctx, x, y, w, h, r, fill, stroke) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            if (fill) ctx.fill();
            if (stroke) ctx.stroke();
        }

        function draw3DCursor(ctx, x, y, size, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = color;
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(size * 0.7, size * 0.5);
            ctx.lineTo(size * 0.4, size * 0.55);
            ctx.lineTo(size * 0.6, size * 0.9);
            ctx.lineTo(size * 0.45, size * 0.95);
            ctx.lineTo(size * 0.28, size * 0.62);
            ctx.lineTo(0, size * 0.75);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        function renderScene(landingProg = 1.0) {
            const th = themes[themeSelect.value];
            const items = parseRawInput();
            const headerPillText = document.getElementById("headerPillInput").value;
            const subLabelText = document.getElementById("subjectLabelInput").value;
            const subNameText = document.getElementById("subjectTitleInput").value;
            const commentCtaText = document.getElementById("commentCtaInput").value;
            const socialText = document.getElementById("socialInput").value;
            const landingMode = parseInt(landingSelect.value, 10);

            ctx.clearRect(0, 0, 1080, 1920);

            // Background
            ctx.fillStyle = th.bg;
            ctx.fillRect(0, 0, 1080, 1920);

            const bgG1 = ctx.createRadialGradient(300, 300, 20, 300, 300, 500);
            bgG1.addColorStop(0, "rgba(255, 255, 255, 0.12)");
            bgG1.addColorStop(1, "transparent");
            ctx.fillStyle = bgG1;
            ctx.fillRect(0, 0, 1080, 1920);

            // Floating 3D Accents
            draw3DCursor(ctx, 940, 240, 60, "#ff7a29");
            draw3DCursor(ctx, 120, 260, 48, "#38bdf8");

            // Header Ribbon
            ctx.save();
            const hProg = Math.min(1, landingProg / 0.3);
            const hEase = 1 - Math.pow(1 - hProg, 3);
            ctx.translate(0, (1 - hEase) * -120);

            // Logo Box
            ctx.fillStyle = "#ffffff";
            ctx.shadowColor = "rgba(0, 0, 0, 0.35)";
            ctx.shadowBlur = 18;
            roundRect(ctx, 80, 90, 390, 84, 22, true, false);

            const bGrad = ctx.createLinearGradient(92, 102, 180, 162);
            bGrad.addColorStop(0, "#ff8a3d");
            bGrad.addColorStop(1, "#ff5400");
            ctx.fillStyle = bGrad;
            roundRect(ctx, 92, 100, 96, 64, 16, true, false);

            ctx.fillStyle = "#ffffff";
            ctx.font = `900 36px 'Montserrat', sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("4X", 140, 132);

            ctx.fillStyle = "#0f172a";
            ctx.font = `900 32px 'Montserrat', sans-serif`;
            ctx.textAlign = "left";
            ctx.fillText("LEARNER", 205, 132);

            // Badge Pill
            roundRect(ctx, 1080 - 80 - 410, 90, 410, 84, 42, "#ffffff", false);
            ctx.fillStyle = "#ff5400";
            ctx.font = "900 28px 'Inter', sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("🔥 DAILY VOCABULARY", 1080 - 80 - 205, 132);
            ctx.restore();

            // Central Board
            const boardX = 70;
            const boardY = 250;
            const boardW = 940;
            const boardH = 1380;

            const cProg = Math.min(1, Math.max(0, (landingProg - 0.1) / 0.4));
            const cEase = 1 - Math.pow(1 - cProg, 3);

            ctx.save();
            ctx.translate(0, (1 - cEase) * 150);

            ctx.fillStyle = th.cardBg;
            ctx.shadowColor = "rgba(0, 0, 0, 0.4)";
            ctx.shadowBlur = 35;
            roundRect(ctx, boardX, boardY, boardW, boardH, 44, true, false);

            // Side Accent Bar
            ctx.fillStyle = th.cardBorder;
            ctx.beginPath();
            ctx.roundRect(boardX, boardY, 22, boardH, [44, 0, 0, 44]);
            ctx.fill();

            // Header Floating Pill
            const pillW = 540;
            const pillH = 92;
            const pillX = 540 - (pillW / 2);
            const pillY = boardY - 46;

            const pGrad = ctx.createLinearGradient(pillX, pillY, pillX, pillY + pillH);
            pGrad.addColorStop(0, th.headerGrad[0]);
            pGrad.addColorStop(1, th.headerGrad[1]);
            ctx.fillStyle = pGrad;
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 6;
            ctx.shadowColor = "rgba(255, 84, 0, 0.4)";
            ctx.shadowBlur = 24;
            roundRect(ctx, pillX, pillY, pillW, pillH, 46, true, true);

            ctx.fillStyle = "#ffffff";
            ctx.font = `900 42px ${th.font.title}, sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowBlur = 0;
            ctx.fillText(headerPillText, 540, pillY + 46);

            // Subject Subtitle & Title
            ctx.fillStyle = th.subLabel;
            ctx.font = `900 28px 'Inter', sans-serif`;
            ctx.fillText(subLabelText, 540, boardY + 95);

            ctx.fillStyle = th.subName;
            ctx.font = `900 52px ${th.font.title}, sans-serif`;
            ctx.fillText(subNameText, 540, boardY + 155);

            // 5 Word Rows Stack
            const rowYStart = boardY + 225;
            const rowH = 195;
            const rowGap = 24;
            const rowW = boardW - 90;
            const rowX = boardX + 45;

            items.forEach((item, idx) => {
                const y = rowYStart + idx * (rowH + rowGap);
                const rowStyle = th.rows[idx % th.rows.length];

                // Staggered Landing Animation Calculation
                const rProg = Math.min(1, Math.max(0, (landingProg - (0.2 + idx * 0.12)) / 0.35));
                const rEase = 1 - Math.pow(1 - rProg, 3);

                let shiftX = 0;
                let shiftScale = 1;

                if (landingMode === 1) {
                    shiftScale = 0.5 + 0.5 * rEase;
                } else if (landingMode === 2) {
                    shiftX = (1 - rEase) * (idx % 2 === 0 ? -600 : 600);
                } else {
                    shiftX = (1 - rEase) * 600;
                }

                ctx.save();
                ctx.globalAlpha = rProg;
                ctx.translate(shiftX, 0);

                if (landingMode === 1) {
                    ctx.translate(rowX + rowW / 2, y + rowH / 2);
                    ctx.scale(shiftScale, shiftScale);
                    ctx.translate(-(rowX + rowW / 2), -(y + rowH / 2));
                }

                // Row Background Container
                const rowGrad = ctx.createLinearGradient(rowX, y, rowX + rowW, y);
                rowGrad.addColorStop(0, rowStyle.bg[0]);
                rowGrad.addColorStop(1, rowStyle.bg[1]);
                ctx.fillStyle = rowGrad;
                ctx.shadowColor = "rgba(0, 0, 0, 0.25)";
                ctx.shadowBlur = 16;
                roundRect(ctx, rowX, y, rowW, rowH, 28, true, false);

                // Number Badge Box
                const bSize = 120;
                const bPad = 26;
                ctx.fillStyle = rowStyle.numBg;
                roundRect(ctx, rowX + bPad, y + (rowH - bSize) / 2, bSize, bSize, 22, true, false);

                ctx.fillStyle = rowStyle.numTxt;
                ctx.font = `900 64px 'Montserrat', sans-serif`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(item.num, rowX + bPad + bSize / 2, y + rowH / 2);

                // Text Content - English Word
                const textStartX = rowX + bPad + bSize + 32;
                ctx.fillStyle = "#ffffff";
                ctx.font = `900 48px ${th.font.title}, sans-serif`;
                ctx.textAlign = "left";
                ctx.textBaseline = "middle";
                ctx.fillText(item.en, textStartX, y + 62);

                // Text Content - Hindi Meaning
                ctx.fillStyle = "#fef08a";
                ctx.font = `800 40px 'Noto Sans Devanagari', sans-serif`;
                ctx.fillText(item.hi, textStartX, y + 132);

                ctx.restore();
            });

            ctx.restore();

            // Bottom CTA Pill
            ctx.save();
            const ctaW = 380;
            const ctaH = 80;
            roundRect(ctx, 1080 - 70 - ctaW, boardY + boardH + 16, ctaW, ctaH, 40, "#ffffff", false);
            ctx.fillStyle = "#ea580c";
            ctx.font = `900 24px 'Inter', sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(`📢 ${commentCtaText}`, 1080 - 70 - ctaW / 2, boardY + boardH + 16 + ctaH / 2);
            ctx.restore();

            // Footer Ribbon
            const footY = 1750;
            const ribbonW = 940;
            const ribbonH = 92;
            const ribbonX = 540 - ribbonW / 2;

            roundRect(ctx, ribbonX, footY, ribbonW, ribbonH, 46, th.footerBg, false);

            ctx.fillStyle = "#ffffff";
            ctx.font = `800 32px 'Inter', sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(`⚡ 4X LEARNER • ${socialText} • Follow for Daily Vocab`, 540, footY + ribbonH / 2);
        }

        // Animation Loop
        function runFastLandingAnimation() {
            let start = null;
            const duration = 1400;

            function step(timestamp) {
                if (!start) start = timestamp;
                const elapsed = timestamp - start;
                const progress = Math.min(1.0, elapsed / duration);

                renderScene(progress);

                if (progress < 1.0) {
                    requestAnimationFrame(step);
                }
            }
            requestAnimationFrame(step);
        }

        // Download PNG
        function downloadImage() {
            renderScene(1.0);
            const a = document.createElement("a");
            a.download = `4X_LEARNER_Top5_${Date.now()}.png`;
            a.href = canvas.toDataURL("image/png", 1.0);
            a.click();
        }

        // Video Export (60FPS WebM)
        function exportReelsVideo() {
            const btn = document.getElementById("recordBtn");
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Rendering Reel Video...`;
            btn.disabled = true;

            const stream = canvas.captureStream(60);
            const recorder = new MediaRecorder(stream, {
                mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm'
            });
            const chunks = [];

            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `4X_LEARNER_Top5_Reel_${Date.now()}.webm`;
                a.click();
                btn.innerHTML = `<i class="fa-solid fa-video"></i> Export 1080x1920 60FPS Video`;
                btn.disabled = false;
            };

            recorder.start();

            const TOTAL_DURATION = 4000;
            const startTime = performance.now();

            function step(now) {
                const elapsed = now - startTime;
                const progress = Math.min(1.0, elapsed / 1400);

                renderScene(progress);

                if (elapsed < TOTAL_DURATION) {
                    requestAnimationFrame(step);
                } else {
                    recorder.stop();
                }
            }
            requestAnimationFrame(step);
        }

        // Real-time Inputs
        [
            "themeSelect", "headerPillInput", "subjectLabelInput",
            "subjectTitleInput", "commentCtaInput", "socialInput", "rawInput"
        ].forEach(id => {
            document.getElementById(id).addEventListener("input", () => renderScene(1.0));
        });

        document.getElementById("landingSelect").addEventListener("change", runFastLandingAnimation);

        renderScene(1.0);
        runFastLandingAnimation();
    </script>
</body>

</html>
