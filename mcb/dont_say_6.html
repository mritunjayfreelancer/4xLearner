<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>4X Learner - Mobile First Viral Studio</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&family=Poppins:wght@600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-body: #080a10;
            --panel-bg: #111827;
            --accent: #ef4444;
            --accent-green: #22c55e;
            --text-light: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100%;
            width: 100vw;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-body);
            color: var(--text-light);
            touch-action: manipulation;
        }

        /* Mobile Container: 2-Tier Stack */
        .mobile-shell {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            width: 100vw;
        }

        /* TOP SCREEN (46%): Sticky Scaled Preview */
        .preview-zone {
            height: 46dvh;
            min-height: 220px;
            background: radial-gradient(circle at center, #1b2234 0%, #080a10 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 2px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            flex-shrink: 0;
        }

        .canvas-scaler {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        /* The 9:16 Canvas */
        #render-target {
            width: 420px;
            height: 746px;
            /* 9:16 Ratio */
            border-radius: 28px;
            position: relative;
            padding: 22px 18px 18px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95);
            background: #111215;
            flex-shrink: 0;
            transform-origin: center center;
            transition: width 0.2s, height 0.2s;
        }

        /* Aspect Ratio Switchers */
        #render-target.ratio-reel {
            width: 420px;
            height: 746px;
            border-radius: 28px;
        }

        #render-target.ratio-insta {
            width: 450px;
            height: 562px;
            border-radius: 24px;
        }

        #render-target.ratio-square {
            width: 460px;
            height: 460px;
            border-radius: 20px;
        }

        #render-target.ratio-fb {
            width: 500px;
            height: 400px;
            border-radius: 18px;
        }

        .target-content {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Header Elements */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .brand-capsule {
            background: rgba(255, 255, 255, 0.08);
            padding: 5px 12px 5px 6px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-tag {
            background: #ea580c;
            color: #fff;
            padding: 3px 9px;
            border-radius: 20px;
            font-size: 0.74rem;
            font-weight: 900;
        }

        .brand-name {
            color: #ffffff;
            font-size: 0.82rem;
            font-weight: 800;
        }

        .channel-handle {
            color: #e2e8f0;
            font-size: 0.85rem;
            font-weight: 800;
        }

        /* Titles */
        .title-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 14px;
            text-align: center;
        }

        .category-pill {
            background: #854d0e;
            color: #fef08a;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }

        .main-headline {
            font-size: 1.45rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.3px;
            font-family: 'Outfit', sans-serif;
            margin-bottom: 2px;
        }

        .sub-headline {
            font-size: 0.78rem;
            font-weight: 700;
            color: #94a3b8;
        }

        /* Items Movable Wrapper */
        .movable-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            transition: transform 0.05s linear;
        }

        .items-list {
            display: flex;
            flex-direction: column;
            gap: 11px;
            flex: 1;
            justify-content: space-evenly;
        }

        /* Cards */
        .card-row {
            background: #ffffff;
            border-radius: 18px;
            display: flex;
            align-items: stretch;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.4);
        }

        .num-flag {
            width: 54px;
            min-width: 54px;
            background: #dc2626;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            font-weight: 900;
            clip-path: polygon(0 0, 100% 0, 80% 100%, 0 100%);
        }

        .card-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px 8px 6px;
            gap: 8px;
        }

        .wrong-box {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
        }

        .label-wrong {
            font-size: 0.62rem;
            font-weight: 800;
            color: #dc2626;
            text-transform: uppercase;
        }

        .text-wrong {
            font-size: 0.92rem;
            font-weight: 700;
            color: #64748b;
            text-decoration: line-through;
            line-height: 1.2;
        }

        .correct-box {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1.2;
            justify-content: flex-end;
        }

        .correct-text-group {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
        }

        .label-correct {
            font-size: 0.62rem;
            font-weight: 800;
            color: #15803d;
            text-transform: uppercase;
        }

        .text-correct {
            font-size: 1.02rem;
            font-weight: 900;
            color: #0f172a;
            text-align: right;
            line-height: 1.2;
        }

        .check-pill {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #16a34a;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 900;
            flex-shrink: 0;
        }

        .bottom-footer {
            margin-top: 12px;
            text-align: center;
            font-size: 0.74rem;
            font-weight: 800;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* BOTTOM SCREEN (54%): Pure Mobile Tabbed Controller */
        .controls-zone {
            height: 54dvh;
            background: #0f1523;
            display: flex;
            flex-direction: column;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* Mobile Segment Tabs */
        .tab-bar {
            display: flex;
            background: #07090f;
            padding: 6px;
            gap: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tab-btn {
            flex: 1;
            padding: 8px 4px;
            background: #172033;
            border: none;
            border-radius: 8px;
            color: #94a3b8;
            font-size: 0.74rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .tab-btn.active {
            background: #ef4444;
            color: #ffffff;
        }

        /* Scrollable Panels */
        .tab-content-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px 80px;
            /* Room for bottom sticky bar */
        }

        .tab-panel {
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .tab-panel.active {
            display: flex;
        }

        /* Form Controls */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 0.7rem;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
        }

        textarea,
        select,
        input[type="text"] {
            background: #172033;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            color: #fff;
            padding: 10px;
            font-size: 0.86rem;
            outline: none;
            font-family: inherit;
        }

        textarea {
            height: 105px;
            font-family: monospace;
            line-height: 1.4;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        /* Slider Controls */
        .slider-box {
            background: #172033;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .slider-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.72rem;
            font-weight: 700;
            color: #94a3b8;
        }

        input[type="range"] {
            accent-color: #ef4444;
            height: 6px;
            background: #080a10;
            border-radius: 4px;
        }

        /* Bottom Fixed Action Bar */
        .bottom-action-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(7, 9, 15, 0.95);
            backdrop-filter: blur(10px);
            padding: 10px 14px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        .btn-action {
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-size: 0.86rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #fff;
        }

        .btn-download {
            background: linear-gradient(135deg, #ef4444, #f97316);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }

        .btn-video {
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
    </style>
</head>

<body>

    <div class="mobile-shell">

        <!-- 1. TOP VIEW (Auto Scaled without scroll) -->
        <div class="preview-zone" id="topStage">
            <div class="canvas-scaler">
                <div id="render-target" class="ratio-reel">
                    <div class="target-content">
                        <!-- Top Bar -->
                        <div class="top-nav">
                            <div class="brand-capsule">
                                <span class="brand-tag" id="dispBrandTag">4X</span>
                                <span class="brand-name" id="dispBrandName">LEARNER</span>
                            </div>
                            <div class="channel-handle" id="dispHairline">@4xlearner</div>
                        </div>

                        <!-- Headlines -->
                        <div class="title-block">
                            <span class="category-pill" id="dispBadge">STOP SAYING THIS</span>
                            <h2 class="main-headline" id="dispTitle">DON'T SAY VS SAY</h2>
                            <p class="sub-headline" id="dispSubTitle">Speak English Like a Native Speaker</p>
                        </div>

                        <!-- Movable Rows Area -->
                        <div class="movable-wrapper" id="cardInnerShift">
                            <div class="items-list" id="itemsContainer"></div>
                        </div>

                        <!-- Footer -->
                        <div class="bottom-footer" id="dispFooter">
                            🎯 Save for later & Follow @4xlearner!
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. BOTTOM CONTROLS (Mobile First Tab Navigation) -->
        <div class="controls-zone">
            <!-- Tabs -->
            <div class="tab-bar">
                <button class="tab-btn active" onclick="switchTab('tabText')">✍️ Text Content</button>
                <button class="tab-btn" onclick="switchTab('tabSpace')">📐 Spacing / Shift</button>
                <button class="tab-btn" onclick="switchTab('tabStyle')">🎨 Sizes & Themes</button>
            </div>

            <!-- Tab Content -->
            <div class="tab-content-container">

                <!-- TAB 1: TEXT CONTENT -->
                <div class="tab-panel active" id="tabText">
                    <div class="form-group">
                        <label>Paste Don't Say vs Say (Quick Update)</label>
                        <textarea id="inputText">1- Don't say: I am coming
Say: I'm on my way

2- Don't say: Where you are?
Say: Where are you?

3- Don't say: What you are doing?
Say: What are you doing?

4- Don't say: I didn't knew
Say: I didn't know

5- Don't say: I am agree
Say: I agree</textarea>
                    </div>

                    <div class="grid-2">
                        <div class="form-group">
                            <label>Main Headline</label>
                            <input type="text" id="titleInput" value="DON'T SAY VS SAY" />
                        </div>
                        <div class="form-group">
                            <label>Sub Headline</label>
                            <input type="text" id="subTitleInput" value="Speak English Like a Native Speaker" />
                        </div>
                    </div>

                    <div class="grid-2">
                        <div class="form-group">
                            <label>Top Tag Badge</label>
                            <input type="text" id="badgeInput" value="STOP SAYING THIS" />
                        </div>
                        <div class="form-group">
                            <label>Brand Name</label>
                            <input type="text" id="brandNameInput" value="LEARNER" />
                        </div>
                    </div>

                    <div class="grid-2">
                        <div class="form-group">
                            <label>Handle (@)</label>
                            <input type="text" id="topHandleInput" value="@4xlearner" />
                        </div>
                        <div class="form-group">
                            <label>Footer Text</label>
                            <input type="text" id="footerInput" value="🎯 Save for later & Follow @4xlearner!" />
                        </div>
                    </div>
                </div>

                <!-- TAB 2: SPACING & POSITIONING -->
                <div class="tab-panel" id="tabSpace">
                    <div class="slider-box">
                        <div class="slider-group">
                            <div class="slider-meta">
                                <span>Move Up / Down Shift</span>
                                <span id="shiftVal">0px</span>
                            </div>
                            <input type="range" id="shiftRange" min="-50" max="50" value="0" />
                        </div>

                        <div class="slider-group">
                            <div class="slider-meta">
                                <span>Row Spacing (Gap)</span>
                                <span id="gapVal">11px</span>
                            </div>
                            <input type="range" id="gapRange" min="2" max="24" value="11" />
                        </div>

                        <div class="slider-group">
                            <div class="slider-meta">
                                <span>Row Height (Padding)</span>
                                <span id="padVal">8px</span>
                            </div>
                            <input type="range" id="padRange" min="4" max="16" value="8" />
                        </div>
                    </div>
                </div>

                <!-- TAB 3: SIZES & PALETTES -->
                <div class="tab-panel" id="tabStyle">
                    <div class="form-group">
                        <label>Social Platform Ratio</label>
                        <select id="sizeSelector">
                            <option value="ratio-reel">📱 9:16 (Reels / Shorts / Story)</option>
                            <option value="ratio-insta">📷 4:5 (Instagram Portrait)</option>
                            <option value="ratio-square">⏹️ 1:1 (Square Post)</option>
                            <option value="ratio-fb">📰 Landscape (Facebook Post)</option>
                        </select>
                    </div>

                    <div class="grid-2">
                        <div class="form-group">
                            <label>Quality Resolution</label>
                            <select id="resSelector">
                                <option value="4K">⚡ 4K Ultra Clear (2160p)</option>
                                <option value="2K" selected>🌟 2K Full HD (1080p)</option>
                                <option value="720">⚡ 720p Lite</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Color Theme</label>
                            <select id="themeSelect">
                                <option value="accent_red_orange">1. Red & Orange Accent (Dark)</option>
                                <option value="multi_vibrant">2. Rainbow Multi-Color</option>
                                <option value="royal_emerald">3. Emerald Green</option>
                                <option value="cyber_neon">4. Cyber Neon Dark</option>
                            </select>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Sticky Bottom Buttons -->
            <div class="bottom-action-bar">
                <button id="downloadBtn" class="btn-action btn-download">⚡ Download Photo</button>
                <button id="videoBtn" class="btn-action btn-video">🎬 Fast 9:16 Video</button>
            </div>
        </div>

    </div>

    <script>
        const THEMES = {
            accent_red_orange: {
                bg: "#111215",
                badgeBg: "#854d0e",
                badgeColor: "#fef08a",
                flags: ["#dc2626", "#ea580c", "#d97706", "#dc2626", "#b91c1c"]
            },
            multi_vibrant: {
                bg: "#0d1117",
                badgeBg: "#4338ca",
                badgeColor: "#c7d2fe",
                flags: ["#4f46e5", "#059669", "#ea580c", "#dc2626", "#0284c7"]
            },
            royal_emerald: {
                bg: "#06130e",
                badgeBg: "#064e3b",
                badgeColor: "#6ee7b7",
                flags: ["#059669", "#0d9488", "#10b981", "#047857", "#065f46"]
            },
            cyber_neon: {
                bg: "#080c18",
                badgeBg: "#1e1b4b",
                badgeColor: "#93c5fd",
                flags: ["#6366f1", "#3b82f6", "#8b5cf6", "#06b6d4", "#ec4899"]
            }
        };

        const renderTarget = document.getElementById("render-target");
        const topStage = document.getElementById("topStage");
        const cardInnerShift = document.getElementById("cardInnerShift");

        const sizeSelector = document.getElementById("sizeSelector");
        const resSelector = document.getElementById("resSelector");
        const themeSelect = document.getElementById("themeSelect");

        const shiftRange = document.getElementById("shiftRange");
        const gapRange = document.getElementById("gapRange");
        const padRange = document.getElementById("padRange");

        const shiftVal = document.getElementById("shiftVal");
        const gapVal = document.getElementById("gapVal");
        const padVal = document.getElementById("padVal");

        const inputText = document.getElementById("inputText");
        const titleInput = document.getElementById("titleInput");
        const subTitleInput = document.getElementById("subTitleInput");
        const badgeInput = document.getElementById("badgeInput");
        const brandNameInput = document.getElementById("brandNameInput");
        const topHandleInput = document.getElementById("topHandleInput");
        const footerInput = document.getElementById("footerInput");

        const dispTitle = document.getElementById("dispTitle");
        const dispSubTitle = document.getElementById("dispSubTitle");
        const dispBadge = document.getElementById("dispBadge");
        const dispBrandName = document.getElementById("dispBrandName");
        const dispHairline = document.getElementById("dispHairline");
        const dispFooter = document.getElementById("dispFooter");
        const itemsContainer = document.getElementById("itemsContainer");

        // Tab Switcher
        function switchTab(tabId) {
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));

            event.target.classList.add("active");
            document.getElementById(tabId).classList.add("active");
        }

        // Auto Scale To Mobile View
        function autoScaleCard() {
            const stageW = topStage.clientWidth - 16;
            const stageH = topStage.clientHeight - 16;

            const cardW = renderTarget.offsetWidth;
            const cardH = renderTarget.offsetHeight;

            const scaleFactor = Math.min(stageW / cardW, stageH / cardH, 1);
            renderTarget.style.transform = `scale(${scaleFactor})`;
        }

        window.addEventListener("resize", autoScaleCard);

        function parseDontSayInput(text) {
            const lines = text.split("\n").map(l => l.trim()).filter(l => l.length > 0);
            const items = [];
            let current = { wrong: "", correct: "" };

            lines.forEach(line => {
                const clean = line.replace(/^\d+[\.\-\)]\s*/i, '');
                if (/don'?t\s*say\s*[:\-]/i.test(clean)) {
                    if (current.wrong && current.correct) items.push({ ...current });
                    current.wrong = clean.replace(/don'?t\s*say\s*[:\-]\s*/i, '').trim();
                } else if (/say\s*[:\-]/i.test(clean)) {
                    current.correct = clean.replace(/say\s*[:\-]\s*/i, '').trim();
                    items.push({ ...current });
                    current = { wrong: "", correct: "" };
                } else if (clean.includes("vs") || clean.includes("->") || clean.includes("/")) {
                    const parts = clean.split(/vs|->|\//i);
                    if (parts.length >= 2) {
                        items.push({
                            wrong: parts[0].replace(/don'?t\s*say\s*[:\-]?/i, '').trim(),
                            correct: parts[1].replace(/say\s*[:\-]?/i, '').trim()
                        });
                    }
                }
            });

            if (items.length === 0) {
                for (let i = 0; i < lines.length; i += 2) {
                    items.push({
                        wrong: lines[i] || "Don't say this",
                        correct: lines[i + 1] || "Say this"
                    });
                }
            }
            return items;
        }

        function updateCard() {
            dispTitle.textContent = titleInput.value;
            dispSubTitle.textContent = subTitleInput.value;
            dispBadge.textContent = badgeInput.value;
            dispBrandName.textContent = brandNameInput.value;
            dispHairline.textContent = topHandleInput.value;
            dispFooter.textContent = footerInput.value;

            renderTarget.className = sizeSelector.value;

            const shiftY = shiftRange.value;
            shiftVal.innerText = `${shiftY}px`;
            cardInnerShift.style.transform = `translateY(${shiftY}px)`;

            const gap = gapRange.value;
            gapVal.innerText = `${gap}px`;
            itemsContainer.style.gap = `${gap}px`;

            const pad = padRange.value;
            padVal.innerText = `${pad}px`;

            const theme = THEMES[themeSelect.value] || THEMES.accent_red_orange;
            renderTarget.style.background = theme.bg;
            dispBadge.style.background = theme.badgeBg;
            dispBadge.style.color = theme.badgeColor;

            const items = parseDontSayInput(inputText.value);
            itemsContainer.innerHTML = "";

            items.forEach((item, index) => {
                const flagColor = theme.flags[index % theme.flags.length];
                const row = document.createElement("div");
                row.className = "card-row";

                row.innerHTML = `
                    <div class="num-flag" style="background: ${flagColor};">
                        ${index + 1}
                    </div>
                    <div class="card-content" style="padding-top: ${pad}px; padding-bottom: ${pad}px;">
                        <div class="wrong-box">
                            <span class="label-wrong">✕ DON'T SAY</span>
                            <span class="text-wrong">${item.wrong}</span>
                        </div>
                        <div class="correct-box">
                            <div class="correct-text-group">
                                <span class="label-correct">✓ SAY THIS</span>
                                <span class="text-correct">${item.correct}</span>
                            </div>
                            <div class="check-pill">✓</div>
                        </div>
                    </div>
                `;
                itemsContainer.appendChild(row);
            });

            setTimeout(autoScaleCard, 30);
        }

        [inputText, titleInput, subTitleInput, badgeInput, brandNameInput, topHandleInput, footerInput, themeSelect, sizeSelector, shiftRange, gapRange, padRange].forEach(el => {
            el.addEventListener("input", updateCard);
            el.addEventListener("change", updateCard);
        });

        updateCard();

        // 4K Photo Download
        document.getElementById("downloadBtn").addEventListener("click", async () => {
            const btn = document.getElementById("downloadBtn");
            btn.innerText = "⏳ Exporting...";
            btn.disabled = true;

            try {
                let targetWidth = 1080;
                if (resSelector.value === "4K") targetWidth = 2160;
                if (resSelector.value === "720") targetWidth = 720;

                const actualWidth = renderTarget.offsetWidth;
                const exportScale = targetWidth / actualWidth;

                const currentTransform = renderTarget.style.transform;
                renderTarget.style.transform = "none";

                const canvas = await html2canvas(renderTarget, {
                    scale: exportScale,
                    useCORS: true,
                    backgroundColor: null,
                    logging: false
                });

                renderTarget.style.transform = currentTransform;

                const link = document.createElement("a");
                link.download = `DontSay_Reel_${Date.now()}.png`;
                link.href = canvas.toDataURL("image/png", 1.0);
                link.click();
            } catch (err) {
                alert("Download failed. Please try again!");
            } finally {
                btn.innerText = "⚡ Download Photo";
                btn.disabled = false;
            }
        });

        // Fast 9:16 Video Export
        document.getElementById("videoBtn").addEventListener("click", async () => {
            const btn = document.getElementById("videoBtn");
            btn.innerText = "🎬 Recording...";
            btn.disabled = true;

            try {
                const currentTransform = renderTarget.style.transform;
                renderTarget.style.transform = "none";

                const canvas = await html2canvas(renderTarget, { scale: 2, useCORS: true });
                renderTarget.style.transform = currentTransform;

                const stream = canvas.captureStream(30);
                let mimeType = "video/webm;codecs=vp9";
                if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = "video/webm";

                const recorder = new MediaRecorder(stream, { mimeType });
                const chunks = [];

                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = () => {
                    const blob = new Blob(chunks, { type: "video/webm" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = `DontSay_Reel_${Date.now()}.webm`;
                    a.click();
                    btn.innerText = "🎬 Fast 9:16 Video";
                    btn.disabled = false;
                };

                recorder.start();

                setTimeout(() => {
                    recorder.stop();
                }, 3500);

            } catch (e) {
                alert("Video recording failed on this device.");
                btn.innerText = "🎬 Fast 9:16 Video";
                btn.disabled = false;
            }
        });
    </script>
</body>
