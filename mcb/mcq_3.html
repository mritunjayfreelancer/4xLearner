<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>4xlearner Master Quiz Studio</title>

    <!-- Multi-Theme Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bangers&family=Cinzel:wght@700;900&family=Fredoka+One&family=Montserrat:wght@700;800;900&family=Orbitron:wght@800;900&family=Outfit:wght@600;800;900&family=Pacifico&family=Press+Start+2P&family=Righteous&display=swap"
        rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg: #07090e;
            --panel: #111726;
            --accent: #f59e0b;
            --text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* TOP BAR */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(17, 23, 38, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #1e293b;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .brand-title {
            font-family: 'Fredoka One', cursive;
            color: #fbbf24;
            font-size: 1.25rem;
            letter-spacing: 0.5px;
        }

        .menu-toggle-btn {
            background: #f59e0b;
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        /* LAYOUT */
        .app-layout {
            display: flex;
            height: calc(100vh - 54px);
            position: relative;
        }

        .preview-stage {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #04060a;
            padding: 15px;
            overflow: auto;
            min-height: 100%;
        }

        .control-drawer {
            width: 380px;
            background: var(--panel);
            border-left: 1px solid #1e293b;
            height: 100%;
            overflow-y: auto;
            padding: 20px;
            z-index: 90;
            transition: transform 0.3s ease;
        }

        @media (max-width: 860px) {
            .control-drawer {
                position: fixed;
                top: 54px;
                right: 0;
                bottom: 0;
                width: 100%;
                max-width: 380px;
                transform: translateX(100%);
            }

            .control-drawer.open {
                transform: translateX(0);
            }
        }

        label {
            font-size: 0.72rem;
            font-weight: 900;
            color: #94a3b8;
            margin-top: 14px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        textarea,
        select,
        input {
            width: 100%;
            padding: 9px;
            background: #090d16;
            border: 1.5px solid #334155;
            color: #fff;
            border-radius: 8px;
            font-size: 0.88rem;
            outline: none;
            margin-top: 4px;
        }

        textarea:focus,
        select:focus,
        input:focus {
            border-color: #fbbf24;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 12px;
            font-weight: 900;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-replay {
            background: #3b82f6;
            color: #fff;
            width: 100%;
            margin-top: 14px;
        }

        .btn-img {
            background: #10b981;
            color: #fff;
        }

        .btn-vid {
            background: #ef4444;
            color: #fff;
        }

        /* QUIZ BASE CONTAINER */
        .quiz-card {
            width: 360px;
            height: 640px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            user-select: none;
            flex-shrink: 0;
            transition: width 0.25s, height 0.25s;
        }

        .draggable {
            cursor: grab;
            touch-action: none;
            position: relative;
            z-index: 10;
        }

        .draggable:active {
            cursor: grabbing;
        }

        /* CARD INTERNAL LAYOUT */
        .top-brand {
            position: absolute;
            top: 15px;
            left: 18px;
            z-index: 15;
            font-weight: 900;
            font-size: 0.8rem;
            padding: 5px 14px;
            border-radius: 20px;
        }

        .header-block {
            position: absolute;
            top: 55px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 12;
        }

        .bubble-row {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 10px;
            margin-bottom: 8px;
        }

        .speech-bubble {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 900;
        }

        .speech-bubble.bubble-center {
            width: 62px;
            height: 62px;
            font-size: 2.1rem;
            margin-bottom: 8px;
        }

        .quiz-title-card {
            width: 100%;
            border-radius: 22px;
            padding: 6px 0;
            text-align: center;
        }

        .quiz-title-card h1 {
            font-size: 4rem;
            line-height: 0.95;
            letter-spacing: 2px;
        }

        .content-area {
            position: relative;
            z-index: 14;
            width: 100%;
            margin-top: 240px;
            padding: 0 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 800;
            text-align: center;
            line-height: 1.35;
            margin-bottom: 16px;
            width: 100%;
        }

        .options-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .opt-card {
            border-radius: 40px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
        }

        .opt-badge {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-right: 12px;
            font-size: 1.2rem;
            font-weight: 900;
        }

        .opt-title {
            font-size: 1.05rem;
            font-weight: 800;
            line-height: 1.2;
        }

        .footer-brand {
            position: relative;
            z-index: 15;
            margin-bottom: 16px;
            font-weight: 900;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        /* ===================================================================== */
        /* 20 DIVERSE PREMIUM THEMES (FONTS, BUTTONS, GLOWS, AND BORDERS)        */
        /* ===================================================================== */

        /* 1. School Grid 3D (Screenshot Look) */
        .th-1 {
            background: #034687;
            font-family: 'Fredoka One', cursive;
            border-radius: 28px;
        }

        .th-1::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 240px;
            background-color: #fff;
            background-image: linear-gradient(#002f6c 1.5px, transparent 1.5px), linear-gradient(90deg, #002f6c 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            z-index: 1;
        }

        .th-1 .top-brand {
            background: #034687;
            color: #fff;
            border: 2px solid #fff;
        }

        .th-1 .speech-bubble {
            background: #0284c7;
            color: #fff;
            border: 3px solid #fff;
            box-shadow: 0 5px 0 #002f6c;
        }

        .th-1 .quiz-title-card {
            background: #f59e0b;
            border: 4px solid #fff;
            box-shadow: 0 6px 0 #b45309;
        }

        .th-1 .quiz-title-card h1 {
            color: #fff;
            text-shadow: 0 4px 0 #b45309;
            -webkit-text-stroke: 2px #b45309;
        }

        .th-1 .question-text {
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
        }

        .th-1 .opt-card {
            background: #fffaee;
            border: 2px solid #fff;
            box-shadow: 0 5px 0 #d97706;
        }

        .th-1 .opt-badge {
            background: #f59e0b;
            color: #000;
        }

        .th-1 .opt-title {
            color: #000;
            font-family: 'Montserrat', sans-serif;
        }

        .th-1 .footer-brand {
            color: #ffffff;
        }

        /* 2. Cyber Neon Pulse */

        }

        .th-4 .quiz-title-card {

        .th-4 .quiz-title-card h1 {

        .th-4 .opt-badge {

        .th-4 .opt-title {

        .th-5 {

        .th-6 {
            background: linear-gradient(135deg, #6366f1 0%, #d946ef 100%);
            font-family: 'Outfit', sans-serif;
        }

        .th-6 .top-brand {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            color: #fff;

        }

        .th-6 .speech-bubble {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);

        }

        .th-6 .quiz-title-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(14px);

        }

        .th-6 .quiz-title-card h1 {
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .th-6 .question-text {

        }

        .th-6 .opt-card {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);

        }

        .th-6 .opt-badge {
            background: #fff;
            color: #6366f1;
        }

        .th-6 .opt-title {
            color: #fff;
        }

        .th-6 .footer-brand {
            color: #fff;
        }

        /* 11. Deep Violet Galaxy */
        .th-11 {

            font-family: 'Righteous', cursive;
        }

        .th-11 .top-brand {

        .th-11 .speech-bubble {

        .th-11 .quiz-title-card {

        .th-11 .opt-card {

    <script>
        const quizCard = document.getElementById('quizCard');
        const rawInput = document.getElementById('rawInput');
        const themeSelect = document.getElementById('themeSelect');
        const aspectRatio = document.getElementById('aspectRatio');
        const channelName = document.getElementById('channelName');
        const optionsBox = document.getElementById('optionsBox');
        const loader = document.getElementById('loader');

        // Drawer Toggle
        function toggleMenu() {
            document.getElementById('controlDrawer').classList.toggle('open');
        }

        // 1-Box Parser
        rawInput.addEventListener('input', () => {
            const lines = rawInput.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            if (!lines.length) return;

            document.getElementById('dispQ').innerText = lines[0];

            const optKeys = ['optA', 'optB', 'optC', 'optD'];
            optKeys.forEach(k => document.getElementById(k).innerText = '...');

            let count = 0;
            for (let i = 1; i < lines.length; i++) {
                let clean = lines[i].replace(/^([A-Da-d0-9][\.\)\-\:\s]+)/, '');
                if (count < 4) {
                    document.getElementById(optKeys[count]).innerText = clean;
                    count++;
                }
            }
        });

        // Theme Selector
        themeSelect.addEventListener('change', (e) => {
            // Remove all th- classes
            quizCard.className = quizCard.className.replace(/th-\d+/g, '').trim();
            quizCard.classList.add(e.target.value);
        });

        // Channel Name Sync
        channelName.addEventListener('input', (e) => {
            const val = e.target.value || '@4xlearner';
            document.getElementById('dispTopChannel').innerText = val;
            document.getElementById('dispBottomChannel').innerText = val;
        });

        // Aspect Ratio & Layout Adjuster (No Overlap)
        aspectRatio.addEventListener('change', (e) => {
            const val = e.target.value;
            const content = document.getElementById('dragContent');

            // Reset transforms
            document.querySelectorAll('.draggable').forEach(el => el.style.transform = 'translate(0px, 0px)');

            if (val === '9:16') {
                quizCard.style.width = '360px';
                quizCard.style.height = '640px';
                content.style.marginTop = '240px';
                optionsBox.style.display = 'flex';
                optionsBox.style.gridTemplateColumns = 'none';
            } else if (val === '1:1') {
                quizCard.style.width = '480px';
                quizCard.style.height = '480px';
                content.style.marginTop = '210px';
                optionsBox.style.display = 'grid';
                optionsBox.style.gridTemplateColumns = '1fr 1fr';
            } else if (val === '16:9') {
                quizCard.style.width = '640px';
                quizCard.style.height = '360px';
                content.style.marginTop = '180px';
                optionsBox.style.display = 'grid';
                optionsBox.style.gridTemplateColumns = '1fr 1fr';

                optionsBox.style.display = 'flex';
                optionsBox.style.gridTemplateColumns = 'none';

        // Fast Landing Replay
        function triggerFastLanding() {
            quizCard.classList.remove('anim-active');
            void quizCard.offsetWidth;
            quizCard.classList.add('anim-active');
        }

        // Touch & Mouse Drag Functionality
        function makeDraggable(el) {
            let isDragging = false, startX, startY, curX = 0, curY = 0;

            function onStart(e) {
                isDragging = true;
                const evt = e.touches ? e.touches[0] : e;
                startX = evt.clientX - curX;
                startY = evt.clientY - curY;
            }

            function onMove(e) {
                if (!isDragging) return;
                const evt = e.touches ? e.touches[0] : e;
                curX = evt.clientX - startX;
                curY = evt.clientY - startY;
                el.style.transform = `translate(${curX}px, ${curY}px)`;
            }

            function onEnd() { isDragging = false; }

            el.addEventListener('mousedown', onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);
            el.addEventListener('touchstart', onStart, { passive: true });
            window.addEventListener('touchmove', onMove, { passive: true });
            window.addEventListener('touchend', onEnd);
        }
        document.querySelectorAll('.draggable').forEach(makeDraggable);

        // =========================================================================
        // 100% PERFECT 4K IMAGE EXPORT (FREEZES ANIMATIONS AT FINAL SETTLED FRAME)
        // =========================================================================
        async function exportPerfect4KImage() {
            loader.style.display = 'block';
            loader.innerText = '📸 Generating Pure 4K Image (Final Frame)...';

            // 1. Temporarily disable all ongoing CSS animations to lock the final frame
            quizCard.classList.remove('anim-active');

            try {
                const canvas = await html2canvas(quizCard, {
                    scale: 6, // 360 x 6 = 2160px (Standard 4K Ultra High-Definition)
                    useCORS: true,
                    backgroundColor: null,
                    logging: false
                });

                const link = document.createElement('a');
                link.download = `4xlearner-quiz-4k-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();
            } catch (err) {
                alert('Image Export Error: ' + err);
            } finally {
                // Re-enable preview state
                quizCard.classList.add('anim-active');
                loader.style.display = 'none';
            }
        }

        // VIDEO EXPORT (CAPTURES STAGGERED LANDING TO FINAL SETTLED FRAME)
        async function exportMotionVideo() {
            loader.style.display = 'block';
            loader.innerText = '🎥 Recording Fast-Landing Video...';

            const width = 1080;
            const height = 1920;
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            const stream = canvas.captureStream(30);
            const recorder = new MediaRecorder(stream, {
                mimeType: 'video/webm; codecs=vp9',
                videoBitsPerSecond: 9000000
            });

            const chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `4xlearner-video-${Date.now()}.webm`;
                a.click();
                loader.style.display = 'none';
            };

            triggerFastLanding();
            recorder.start();

            let frames = 0;
            const maxFrames = 90; // 3 seconds total

            const captureInterval = setInterval(async () => {
                const frameCanvas = await html2canvas(quizCard, { scale: 3, logging: false });
                ctx.clearRect(0, 0, width, height);
                ctx.drawImage(frameCanvas, 0, 0, width, height);

                frames++;
                if (frames >= maxFrames) {
                    clearInterval(captureInterval);
                    recorder.stop();
                }
            }, 33);
        }
    </script>
