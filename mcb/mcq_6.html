<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>4X Learner • 3D Browser Quiz (Top 20 Glow Themes)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Montserrat:wght@800;900&family=Outfit:wght@600;700;800;900&family=Quicksand:wght@700;800&display=swap');

        :root {
            --bg: #070b14;
            --panel: #111827;
            --line: #263247;
            --text: #f8fafc;
            --accent: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: Outfit, Arial, sans-serif;
        }

        body {
            overflow-x: hidden;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .topbar {
            height: 64px;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: rgba(9, 14, 25, .95);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(18px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 900;
            letter-spacing: .5px;
        }

        .logo {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #f59e0b, #06b6d4, #ec4899);
            box-shadow: 0 8px 24px #0008;
            color: #000;
            font-weight: 900;
            font-size: 15px;
        }

        .brand span {
            font-size: 18px;
        }

        .menuBtn,
        .smallBtn,
        .primaryBtn {
            border: 0;
            color: #fff;
            border-radius: 12px;
            font-weight: 800;
            padding: 10px 14px;
            background: linear-gradient(135deg, #0891b2, #7c3aed);
            box-shadow: 0 8px 25px #0005;
        }

        .app {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 390px;
            height: calc(100vh - 64px);
        }

        .stage {
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: radial-gradient(circle at 50% 50%, #172554 0, #050811 100%);
            overflow: auto;
            position: relative;
        }

        .previewWrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 100%;
            max-height: 100%;
        }

        #canvas {
            display: block;
            width: auto;
            height: auto;
            max-width: calc(100vw - 430px);
            max-height: calc(100vh - 100px);
            border-radius: 24px;
            box-shadow: 0 25px 80px #000b;
            cursor: grab;
            touch-action: none;
        }

        #canvas:active {
            cursor: grabbing;
        }

        .drawer {
            background: linear-gradient(180deg, #111827, #0b1220);
            border-left: 1px solid var(--line);
            overflow-y: auto;
            padding: 18px;
        }

        .section {
            background: #0c1422;
            border: 1px solid #243149;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .section h3 {
            font-size: 13px;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 11px;
        }

        label {
            display: block;
            color: #9fb0c8;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .7px;
            margin: 11px 0 5px;
        }

        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid #30405a;
            background: #070d18;
            color: #fff;
            border-radius: 10px;
            outline: 0;
            padding: 10px 11px;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 116px;
            line-height: 1.45;
        }

        .rangeRow {
            display: grid;
            grid-template-columns: 1fr 58px;
            gap: 8px;
            align-items: center;
        }

        input[type=range] {
            padding: 0;
            accent-color: #38bdf8;
        }

        .value {
            background: #07101c;
            border: 1px solid #27354b;
            border-radius: 9px;
            padding: 7px;
            text-align: center;
            font-size: 12px;
        }

        /* 20 GLOW THEME SWATCHES */
        .swatches {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 7px;
        }

        .swatch {
            height: 36px;
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 0;
            position: relative;
            transition: transform 0.15s, border-color 0.15s;
        }

        .swatch:hover {
            transform: scale(1.05);
        }

        .swatch.active {
            border-color: #fff;
            box-shadow: 0 0 12px #38bdf8;
        }

        .fileUploadBtn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e293b;
            border: 2px dashed #475569;
            color: #cbd5e1;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 800;
            font-size: 13px;
            gap: 8px;
            margin-top: 5px;
        }

        .fileUploadBtn:hover {
            border-color: #38bdf8;
            color: #fff;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .primaryBtn {
            grid-column: 1/-1;
            padding: 13px;
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
            font-size: 14px;
        }

        .primaryBtn:active {
            transform: scale(0.98);
        }

        .drag-tip {
            background: rgba(56, 189, 248, 0.12);
            border: 1px dashed #38bdf8;
            border-radius: 10px;
            padding: 10px;
            font-size: 11px;
            color: #bae6fd;
            line-height: 1.4;
            margin-top: 8px;
        }

        @media(max-width:860px) {
            .topbar {
                height: 58px;
                padding: 0 10px;
            }

            .logo {
                width: 34px;
                height: 34px;
            }

            .brand span {
                font-size: 15px;
            }

            .app {
                display: block;
                height: auto;
            }

            .stage {
                height: calc(100vh - 58px);
                min-height: 540px;
                padding: 10px;
            }

            #canvas {
                max-width: calc(100vw - 20px);
                max-height: calc(100vh - 82px);
                border-radius: 18px;
            }

            .drawer {
                position: fixed;
                z-index: 900;
                right: 0;
                top: 58px;
                bottom: 0;
                width: min(390px, 94vw);
                transform: translateX(105%);
                transition: transform .25s ease;
                box-shadow: -25px 0 70px #000b;
            }

            .drawer.open {
                transform: translateX(0);
            }
        }
    </style>
</head>

                titleColor: '#fda4af'
            },
            // 18. Rainbow Prism Neon
            {
                frame: ['#38bdf8', '#ec4899'],
                bg: ['#0f172a', '#030712'],
                decor: ['#facc15', '#a855f7', '#38bdf8'],
                opts: ['#ef4444', '#38bdf8', '#22c55e', '#eab308'],
                glows: ['rgba(239,68,68,0.9)', 'rgba(56,189,248,0.9)', 'rgba(34,197,94,0.9)', 'rgba(234,179,8,0.9)'],
                cardBg: '#111827',
                headerBorder: '#38bdf8',
                titleColor: '#38bdf8'
            },
            // 19. Ultra Violet Blacklight
            {
                frame: ['#6366f1', '#312e81'],
                bg: ['#0b0c1e', '#03030d'],
                decor: ['#818cf8', '#a5b4fc', '#3730a3'],
                opts: ['#f43f5e', '#6366f1', '#10b981', '#fbbf24'],
                glows: ['rgba(244,63,94,0.85)', 'rgba(99,102,241,0.95)', 'rgba(16,185,129,0.85)', 'rgba(251,191,36,0.85)'],
                cardBg: '#0e0f26',
                headerBorder: '#6366f1',
                titleColor: '#818cf8'
            }
        ];

        let currentThemeIndex = 0;

        // Populate Swatches
        function createThemeSwatches() {
            const container = $('themes');
            glowThemes.forEach((t, i) => {
                const b = document.createElement('button');
                b.className = 'swatch' + (i === 0 ? ' active' : '');
                b.title = 'Theme ' + (i + 1);
                b.style.background = `linear-gradient(135deg, ${t.frame[0]}, ${t.opts[1]}, ${t.opts[0]})`;
                b.onclick = () => {
                    currentThemeIndex = i;
                    document.querySelectorAll('.swatch').forEach((el, idx) => el.classList.toggle('active', idx === i));
                    render();
                };
                container.appendChild(b);
            });
        }
        createThemeSwatches();

        // Interactive Hitboxes
        let hitRegions = {
            question: { x: 0, y: 0, w: 0, h: 0 },
            options: { x: 0, y: 0, w: 0, h: 0 }
        };

        let draggingTarget = null;
        let dragStartY = 0;
        let initialValY = 0;

        function toggleDrawer() { $('drawer').classList.toggle('open'); }

        function sync() {
            ['contentY', 'questionY', 'optionsY', 'scale', 'glowIntensity', 'bgDim', 'bgBlur'].forEach(id => {
                const v = $(id).value;
                if (id === 'scale' || id === 'bgDim' || id === 'glowIntensity') $(id + 'v').textContent = v + '%';
                else if (id === 'bgBlur') $(id + 'v').textContent = v + 'px';
                else $(id + 'v').textContent = v;
            });
        }

        ['title', 'raw', 'watermark', 'ratio', 'contentY', 'questionY', 'optionsY', 'scale', 'glowIntensity', 'bgDim', 'bgBlur'].forEach(id => {
            $(id).addEventListener(id === 'ratio' ? 'change' : 'input', render);
        });
        ['contentY', 'questionY', 'optionsY', 'scale', 'glowIntensity', 'bgDim', 'bgBlur'].forEach(id => $(id).addEventListener('input', sync));

        // Background Upload Listener
        $('bgUpload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const img = new Image();
                img.onload = () => {
                    customBgImg = img;
                    render();
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        });

        function removeBgImage() {
            customBgImg = null;
            $('bgUpload').value = '';
            render();
        }

        function setSize() {
            const r = $('ratio').value;
            if (r === '9:16') { C.width = 1080; C.height = 1920; }
            if (r === '1:1') { C.width = 1080; C.height = 1080; }
            if (r === '4:5') { C.width = 1080; C.height = 1350; }
            if (r === '16:9') { C.width = 1920; C.height = 1080; }
        }

        function drawRoundRect(c, x, y, w, h, r) {
            r = Math.min(r, w / 2, h / 2);
            c.beginPath(); c.moveTo(x + r, y);
            c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
            c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
            c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y);
            c.closePath();
        }

        function wrapText(c, text, x, y, maxWidth, lineHeight) {
            const words = text.split(/\s+/);
            let line = '';
            let currentY = y;
            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                if (c.measureText(testLine).width > maxWidth && n > 0) {
                    c.fillText(line, x, currentY);
                    line = words[n] + ' ';
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            c.fillText(line, x, currentY);
            return currentY;
        }

        // Draw 3D Light Bulb with Theme Accent Rays
        function draw3DBulb(c, cx, cy, radius, bulbColor, glowFactor, rotation = 0) {
            c.save();
            c.translate(cx, cy);
            c.rotate(rotation);

            // Rays
            c.strokeStyle = bulbColor;
            c.lineWidth = 12;
            c.lineCap = 'round';
            c.shadowColor = bulbColor;
            c.shadowBlur = 20 * glowFactor;
            for (let i = 0; i < 7; i++) {
                const angle = -Math.PI * 0.85 + (i * (Math.PI * 0.7) / 6);
                const r1 = radius * 1.25;
                const r2 = radius * 1.55;
                c.beginPath();
                c.moveTo(Math.cos(angle) * r1, Math.sin(angle) * r1);
                c.lineTo(Math.cos(angle) * r2, Math.sin(angle) * r2);
                c.stroke();
            }

            // Glow
            c.shadowColor = bulbColor;
            c.shadowBlur = 45 * glowFactor;

            // Bulb Head
            const grad = c.createRadialGradient(-radius * 0.3, -radius * 0.3, 10, 0, 0, radius);
            grad.addColorStop(0, '#fff');
            grad.addColorStop(0.35, bulbColor);
            grad.addColorStop(1, '#0f172a');
            c.fillStyle = grad;
            c.beginPath();
            c.arc(0, 0, radius, 0, Math.PI * 2);
            c.fill();

            // Screw Base
            c.shadowBlur = 10;
            c.fillStyle = '#1e293b';
            drawRoundRect(c, -radius * 0.45, radius * 0.75, radius * 0.9, radius * 0.55, 12);
            c.fill();

            c.strokeStyle = bulbColor;
            c.lineWidth = 4;
            c.beginPath();
            c.moveTo(-radius * 0.4, radius * 0.95); c.lineTo(radius * 0.4, radius * 0.95);
            c.moveTo(-radius * 0.35, radius * 1.15); c.lineTo(radius * 0.35, radius * 1.15);
            c.stroke();

            c.restore();
        }

        // Draw 3D Chat Speech Bubble with '?'
        function draw3DQuestionBubble(c, cx, cy, size, bubbleColor, glowFactor, angle = 0) {
            c.save();
            c.translate(cx, cy);
            c.rotate(angle);

            c.shadowColor = bubbleColor;
            c.shadowBlur = 35 * glowFactor;
            c.shadowOffsetX = 8;
            c.shadowOffsetY = 12;

            c.fillStyle = bubbleColor;
            drawRoundRect(c, -size / 2, -size / 2, size, size, size * 0.35);
            c.fill();

            c.beginPath();
            c.moveTo(-size * 0.2, size * 0.45);
            c.lineTo(-size * 0.4, size * 0.8);
            c.lineTo(0, size * 0.45);
            c.closePath();
            c.fill();

            c.lineWidth = 4;
            c.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            c.stroke();

            c.font = `900 ${Math.round(size * 0.65)}px "Fredoka One", sans-serif`;
            c.fillStyle = '#ffffff';
            c.textAlign = 'center';
            c.textBaseline = 'middle';
            c.shadowBlur = 10;
            c.shadowColor = '#fff';
            c.fillText('?', 0, 0);

            c.restore();
        }

        // Draw 3D Tube with Glowing Specular
        function draw3DTube(c, points, width, tubeColor, glowFactor) {
            c.save();
            c.lineCap = 'round';
            c.lineJoin = 'round';

            c.shadowColor = tubeColor;
            c.shadowBlur = 40 * glowFactor;
            c.shadowOffsetY = 10;

            c.strokeStyle = tubeColor;
            c.lineWidth = width;
            c.beginPath();
            c.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                c.lineTo(points[i].x, points[i].y);
            }
            c.stroke();

            c.shadowBlur = 0;
            c.strokeStyle = '#ffffff';
            c.lineWidth = width * 0.3;
            c.stroke();

            c.restore();
        }

        function parsed() {
            const ls = $('raw').value.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
            let q = ls[0] || 'Which color do you like the most?';
            let opts = [];
            for (let i = 1; i < 5; i++) {
                opts.push((ls[i] || ['A. Red', 'B. Blue', 'C. Green', 'D. Yellow'][i - 1]).replace(/^[A-Da-d][\.\)\:\-\s]+/, ''));
            }
            return { q, opts };
        }

        // MASTER GRAPHICS RENDER
        function render() {
            setSize();
            const W = C.width, H = C.height;
            const theme = glowThemes[currentThemeIndex];
            const glowFactor = +$('glowIntensity').value / 100;
            const scale = +$('scale').value / 100;
            const contentShift = +$('contentY').value * (H / 1920);
            const questionShift = +$('questionY').value * (H / 1920);
            const optionsShift = +$('optionsY').value * (H / 1920);

            // 1. BACKGROUND
            if (customBgImg) {
                ctx.save();
                if (+$('bgBlur').value > 0) {
                    ctx.filter = `blur(${+$('bgBlur').value}px)`;
                }
                ctx.drawImage(customBgImg, 0, 0, W, H);
                ctx.filter = 'none';

                const dim = +$('bgDim').value / 100;
                if (dim > 0) {
                    ctx.fillStyle = `rgba(0, 0, 0, ${dim})`;
                    ctx.fillRect(0, 0, W, H);
                }
                ctx.restore();
            } else {
                const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
                bgGrad.addColorStop(0, theme.bg[0]);
                bgGrad.addColorStop(1, theme.bg[1]);
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, W, H);
            }

            // 2. 3D Tubes
            draw3DTube(ctx, [
                { x: W * 0.72, y: H * 0.05 },
                { x: W * 0.88, y: H * 0.09 },
                { x: W * 0.82, y: H * 0.16 },
                { x: W * 0.96, y: H * 0.22 }
            ], 60, theme.decor[2], glowFactor);

            draw3DTube(ctx, [
                { x: W * 0.06, y: H * 0.84 },
                { x: W * 0.14, y: H * 0.88 },
                { x: W * 0.08, y: H * 0.95 },
                { x: W * 0.22, y: H * 0.98 }
            ], 60, theme.decor[2], glowFactor);

            // 3. 3D Corner Bulbs
            draw3DBulb(ctx, W * 0.12, H * 0.11, 46 * scale, theme.decor[0], glowFactor, -0.2);
            draw3DBulb(ctx, W * 0.90, H * 0.90, 48 * scale, theme.decor[0], glowFactor, 0.35);

            // 4. MAIN BROWSER WINDOW CARD
            const cardW = W * 0.78 * scale;
            const cardH = H * 0.64 * scale;
            const cardX = (W - cardW) / 2;
            const cardY = (H - cardH) / 2 + contentShift;

            // Outer Clay & Neon Glow Frame
            ctx.save();
            ctx.shadowColor = theme.frame[0];
            ctx.shadowBlur = 60 * glowFactor;
            ctx.shadowOffsetY = 24;

            const frameGrad = ctx.createLinearGradient(cardX, cardY, cardX + cardW, cardY + cardH);
            frameGrad.addColorStop(0, theme.frame[0]);
            frameGrad.addColorStop(1, theme.frame[1]);
            ctx.fillStyle = frameGrad;
            drawRoundRect(ctx, cardX, cardY, cardW, cardH, 75);
            ctx.fill();

            // Inner Highlight on Frame
            ctx.lineWidth = 5;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.stroke();
            ctx.restore();

            // Inner Window Card
            const pad = 30 * scale;
            const innerX = cardX + pad;
            const innerY = cardY + pad;
            const innerW = cardW - (pad * 2);
            const innerH = cardH - (pad * 2);

            ctx.save();
            ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
            ctx.shadowBlur = 25;
            ctx.shadowOffsetY = 10;
            ctx.fillStyle = theme.cardBg;
            drawRoundRect(ctx, innerX, innerY, innerW, innerH, 60);
            ctx.fill();

            // Top-Right Browser Tab Cutout
            const tabW = innerW * 0.38;
            const tabH = 65 * scale;
            const tabX = innerX + innerW - tabW;
            const tabY = innerY;

            ctx.fillStyle = theme.frame[0];
            drawRoundRect(ctx, tabX, tabY, tabW, tabH, 30);
            ctx.fill();

            // Window Controls: Minimize, Maximize, Close (_ ▢ ✕)
            ctx.font = `900 ${Math.round(28 * scale)}px "Montserrat", sans-serif`;
            ctx.fillStyle = '#000000';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('—', tabX + tabW * 0.28, tabY + tabH * 0.45);
            ctx.fillText('▢', tabX + tabW * 0.58, tabY + tabH * 0.5);
            ctx.fillText('✕', tabX + tabW * 0.85, tabY + tabH * 0.5);
            ctx.restore();

            // 5. Speech Question Bubbles
            draw3DQuestionBubble(ctx, cardX + cardW + 8, cardY + cardH * 0.38, 90 * scale, theme.decor[1], glowFactor, 0.1);
            draw3DQuestionBubble(ctx, cardX - 10, cardY + cardH * 0.74, 100 * scale, theme.decor[1], glowFactor, -0.15);

            // 6. Header Inset Box
            const titleBoxW = innerW * 0.82;
            const titleBoxH = 135 * scale;
            const titleBoxX = (W - titleBoxW) / 2;
            const titleBoxY = innerY + (80 * scale);

            ctx.save();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            drawRoundRect(ctx, titleBoxX, titleBoxY, titleBoxW, titleBoxH, 28);
            ctx.fill();

            ctx.lineWidth = 4;
            ctx.strokeStyle = theme.headerBorder;
            ctx.shadowColor = theme.headerBorder;
            ctx.shadowBlur = 20 * glowFactor;
            ctx.stroke();

            const titleText = $('title').value || "QUIZ TIME";
            ctx.font = `900 ${Math.round(72 * scale)}px "Fredoka One", sans-serif`;
            ctx.fillStyle = theme.titleColor;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowBlur = 18 * glowFactor;
            ctx.shadowColor = theme.titleColor;
            ctx.fillText(titleText, W / 2, titleBoxY + titleBoxH / 2 + (4 * scale));
            ctx.restore();

            // 7. Question Text (Draggable Region)
            const { q, opts } = parsed();
            const qStartY = titleBoxY + titleBoxH + (55 * scale) + questionShift;
            ctx.save();
            ctx.font = `800 ${Math.round(38 * scale)}px "Quicksand", Outfit, sans-serif`;
            ctx.fillStyle = theme.cardBg === '#fbf7ee' ? '#1e293b' : '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const lastQY = wrapText(ctx, q, W / 2, qStartY, innerW - (60 * scale), 48 * scale);
            ctx.restore();

            hitRegions.question = {
                x: innerX,
                y: qStartY - 30 * scale,
                w: innerW,
                h: (lastQY - qStartY) + 60 * scale
            };

            // 8. 2x2 Option Buttons with INDIVIDUAL GLOW FOR EACH OPTION
            const gridW = innerW * 0.88;
            const btnW = (gridW - (20 * scale)) / 2;
            const btnH = 92 * scale;
            const gridStartX = (W - gridW) / 2;
            const defaultGridStartY = innerY + innerH - (320 * scale);
            const gridStartY = defaultGridStartY + optionsShift;

            const optBadges = ['A', 'B', 'C', 'D'];

            for (let i = 0; i < 4; i++) {
                const col = i % 2;
                const row = Math.floor(i / 2);
                const bx = gridStartX + col * (btnW + (20 * scale));
                const by = gridStartY + row * (btnH + (22 * scale));

                ctx.save();

                // Option Individual Glow Effect
                ctx.shadowColor = theme.glows[i];
                ctx.shadowBlur = 26 * glowFactor;
                ctx.shadowOffsetY = 6;

                // Base Navy/Dark Capsule
                ctx.fillStyle = '#1e293b';
                drawRoundRect(ctx, bx, by, btnW, btnH, 24 * scale);
                ctx.fill();

                // Left Colored Badge Pill
                const badgeW = btnW * 0.34;
                ctx.fillStyle = theme.opts[i];
                drawRoundRect(ctx, bx, by, badgeW, btnH, 24 * scale);
                ctx.fill();
                ctx.fillRect(bx + badgeW - (15 * scale), by, 15 * scale, btnH);

                // Option Letter
                ctx.font = `900 ${Math.round(36 * scale)}px "Montserrat", sans-serif`;
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(optBadges[i], bx + (badgeW * 0.46), by + btnH / 2);

                // Option Text
                ctx.font = `800 ${Math.round(32 * scale)}px "Quicksand", sans-serif`;
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';

                let txt = opts[i];
                const textStartX = bx + badgeW + (16 * scale);
                const maxTxtW = btnW - badgeW - (25 * scale);
                if (ctx.measureText(txt).width > maxTxtW) {
                    while (ctx.measureText(txt + '...').width > maxTxtW && txt.length > 0) {
                        txt = txt.slice(0, -1);
                    }
                    txt += '...';
                }
                ctx.fillText(txt, textStartX, by + btnH / 2);

                ctx.restore();
            }

            hitRegions.options = {
                x: gridStartX,
                y: gridStartY,
                w: gridW,
                h: 2 * btnH + (22 * scale)
            };

            // 9. Watermark Badge
            const wm = $('watermark').value || '@4xlearner';
            ctx.save();
            ctx.font = `800 ${Math.round(38 * scale)}px "Outfit", sans-serif`;
            const wmWidth = ctx.measureText(wm).width + 60;
            const wmHeight = 60 * scale;
            const wmX = (W - wmWidth) / 2;
            const wmY = H - (120 * (H / 1920));

            ctx.shadowColor = theme.frame[0];
            ctx.shadowBlur = 20 * glowFactor;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            drawRoundRect(ctx, wmX, wmY, wmWidth, wmHeight, 30);
            ctx.fill();

            ctx.fillStyle = '#0f172a';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(wm, W / 2, wmY + wmHeight / 2);
            ctx.restore();
        }

        // TOUCH & MOUSE DRAGGING ENGINE
        function getCanvasCoordinates(e) {
            const rect = C.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const scaleX = C.width / rect.width;
            const scaleY = C.height / rect.height;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY,
                rawY: clientY
            };
        }

        function onPointerDown(e) {
            const pos = getCanvasCoordinates(e);

            if (pos.x >= hitRegions.options.x && pos.x <= hitRegions.options.x + hitRegions.options.w &&
                pos.y >= hitRegions.options.y && pos.y <= hitRegions.options.y + hitRegions.options.h) {
                draggingTarget = 'options';
                dragStartY = pos.rawY;
                initialValY = +$('optionsY').value;
                return;
            }

            if (pos.x >= hitRegions.question.x && pos.x <= hitRegions.question.x + hitRegions.question.w &&
                pos.y >= hitRegions.question.y && pos.y <= hitRegions.question.y + hitRegions.question.h) {
                draggingTarget = 'question';
                dragStartY = pos.rawY;
                initialValY = +$('questionY').value;
                return;
            }
        }

        function onPointerMove(e) {
            if (!draggingTarget) return;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const deltaY = clientY - dragStartY;

            const rect = C.getBoundingClientRect();
            const scaleFactor = (C.height / rect.height) * (1920 / C.height);
            const computedY = Math.round(initialValY + deltaY * scaleFactor);

            if (draggingTarget === 'options') {
                $('optionsY').value = Math.max(-400, Math.min(300, computedY));
            } else if (draggingTarget === 'question') {
                $('questionY').value = Math.max(-300, Math.min(300, computedY));
            }

            sync();
            render();
        }

        function onPointerUp() {
            draggingTarget = null;
        }

        C.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        C.addEventListener('touchstart', onPointerDown, { passive: true });
        window.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerUp);

        // TRUE 4K DOWNLOAD (DIRECT VECTOR GPU RENDER)
        function downloadPNG() {
            const ow = C.width, oh = C.height;
            const sc = 2; // True 4K (2160x3840)
            const r = $('ratio').value;
            let w = 1080, h = 1920;
            if (r === '1:1') { w = 1080; h = 1080; }
            if (r === '4:5') { w = 1080; h = 1350; }
            if (r === '16:9') { w = 1920; h = 1080; }

            C.width = w * sc; C.height = h * sc;
            render();

            const url = C.toDataURL('image/png', 1.0);
            const a = document.createElement('a');
            a.href = url;
            a.download = `4X-GlowQuiz-4K-${Date.now()}.png`;
            document.body.appendChild(a);
            a.click();
            a.remove();

            C.width = ow; C.height = oh;
            render();
        }

        function resetAll() {
            $('title').value = "QUIZ TIME";
            $('raw').value = "Which color do you like the most?\nA. Red\nB. Blue\nC. Green\nD. Yellow";
            $('watermark').value = '@4xlearner';
            $('ratio').value = '9:16';
            $('contentY').value = 0;
            $('questionY').value = 0;
            $('optionsY').value = -90;
            $('scale').value = 100;
            $('glowIntensity').value = 80;
            $('bgDim').value = 0;
            $('bgBlur').value = 0;
            currentThemeIndex = 0;
            removeBgImage();
            sync();
            render();
        }

        document.fonts.ready.then(() => {
            sync();
            render();
        });

        window.addEventListener('resize', () => requestAnimationFrame(render));
    </script>
