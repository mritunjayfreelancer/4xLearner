<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>4X Learner • 3D Liquid Chrome Quiz Studio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800&display=swap');

        :root {
            --bg: #070b14;
            --panel: #111827;
            --line: #263247;
            --text: #f8fafc;
            --accent: #a855f7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', Outfit, sans-serif;
        }

        body {
            overflow-x: hidden;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .topbar {
            height: 64px;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: rgba(9, 14, 25, .95);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(18px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 900;
            letter-spacing: .5px;
        }

        .logo {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #a855f7, #38bdf8);
            box-shadow: 0 8px 24px rgba(168, 85, 247, 0.4);
            color: #fff;
            font-weight: 900;
            font-size: 15px;
        }

        .brand span {
            font-size: 18px;
        }

        .menuBtn,
        .smallBtn,
        .primaryBtn {
            border: 0;
            color: #fff;
            border-radius: 12px;
            font-weight: 800;
            padding: 10px 14px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.3);
        }

        .app {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 390px;
            height: calc(100vh - 64px);
        }

        .stage {
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0, #050811 100%);
            overflow: auto;
            position: relative;
        }

        .previewWrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 100%;
            max-height: 100%;
        }

        #canvas {
            display: block;
            width: auto;
            height: auto;
            max-width: calc(100vw - 430px);
            max-height: calc(100vh - 100px);
            border-radius: 28px;
            box-shadow: 0 25px 80px #000b;
            cursor: grab;
            touch-action: none;
        }

        #canvas:active {
            cursor: grabbing;
        }

        .drawer {
            background: linear-gradient(180deg, #111827, #0b1220);
            border-left: 1px solid var(--line);
            overflow-y: auto;
            padding: 18px;
        }

        .section {
            background: #0c1422;
            border: 1px solid #243149;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .section h3 {
            font-size: 13px;
            color: #c084fc;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 11px;
        }

        label {
            display: block;
            color: #9fb0c8;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .7px;
            margin: 11px 0 5px;
        }

        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid #30405a;
            background: #070d18;
            color: #fff;
            border-radius: 10px;
            outline: 0;
            padding: 10px 11px;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 116px;
            line-height: 1.45;
        }

        .rangeRow {
            display: grid;
            grid-template-columns: 1fr 58px;
            gap: 8px;
            align-items: center;
        }

        input[type=range] {
            padding: 0;
            accent-color: #a855f7;
        }

        .value {
            background: #07101c;
            border: 1px solid #27354b;
            border-radius: 9px;
            padding: 7px;
            text-align: center;
            font-size: 12px;
        }

        .swatches {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 7px;
        }

        .swatch {
            height: 36px;
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 0;
            position: relative;
            transition: transform 0.15s;
        }

        .swatch:hover {
            transform: scale(1.06);
        }

        .swatch.active {
            border-color: #fff;
            box-shadow: 0 0 12px #a855f7;
        }

        .fileUploadBtn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e293b;
            border: 2px dashed #475569;
            color: #cbd5e1;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 800;
            font-size: 13px;
            gap: 8px;
            margin-top: 5px;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .primaryBtn {
            grid-column: 1/-1;
            padding: 13px;
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
            font-size: 14px;
        }

        .drag-tip {
            background: rgba(168, 85, 247, 0.12);
            border: 1px dashed #a855f7;
            border-radius: 10px;
            padding: 10px;
            font-size: 11px;
            color: #e9d5ff;
            line-height: 1.4;
            margin-top: 8px;
        }

        @media(max-width:860px) {
            .topbar {
                height: 58px;
                padding: 0 10px;
            }

            .logo {
                width: 34px;
                height: 34px;
            }

            .brand span {
                font-size: 15px;
            }

            .app {
                display: block;
                height: auto;
            }

            .stage {
                height: calc(100vh - 58px);
                min-height: 540px;
                padding: 10px;
            }

            #canvas {
                max-width: calc(100vw - 20px);
                max-height: calc(100vh - 82px);
                border-radius: 18px;
            }

            .drawer {
                position: fixed;
                z-index: 900;
                right: 0;
                top: 58px;
                bottom: 0;
                width: min(390px, 94vw);
                transform: translateX(105%);
                transition: transform .25s ease;
                box-shadow: -25px 0 70px #000b;
            }

            .drawer.open {
                transform: translateX(0);
            }
        }
    </style>
</head>

                    <div class="value" id="questionYv">0</div>
                </div>

                    <input id="contentY" type="range" min="-250" max="250" value="0">
                    <div class="value" id="contentYv">0</div>
                </div>

                <label>Overall Scale</label>

                    <input id="scale" type="range" min="80" max="115" value="100">
                    <div class="value" id="scalev">100%</div>
                </div>
            </div>

            <!-- CONTENT INPUT -->

                <h3>Content</h3>
                <label>Top Sub-Heading</label>
                <input id="topSubTitle" value="ITS TIME TO">
                <label>Main Title</label>
                <input id="title" value="QUIZ SESSION">
                <label>Question + 4 Options (One Box)</label>

A. Reading
B. Watching movies
C. Traveling
D. Listening to music</textarea>

                </div>

                <div class="rangeRow">
                    <input id="bgDim" type="range" min="0" max="90" value="0">
                    <div class="value" id="bgDimv">0%</div>
                </div>

                <label>Background Blur</label>

                chromeTint: ['#fecdd3', '#f43f5e', '#fda4af']
            },
            // 15. Electric Blue Night
            {
                bgGrad: ['#172554', '#0b1329', '#030612'],
                glassBg: 'rgba(96, 165, 250, 0.12)',
                glassBorder: 'rgba(147, 197, 253, 0.3)',
                topCapsule: '#93c5fd',
                topCapsuleText: '#000000',
                mainCapsule: '#ffffff',
                mainCapsuleText: '#000000',
                btnGrad: ['#dbeafe', '#93c5fd'],
                btnBorder: 'rgba(255, 255, 255, 0.6)',
                btnTextColor: '#1e3a8a',
                badgeBg: '#ffffff',
                badgeTextColor: '#1e3a8a',
                questionColor: '#eff6ff',
                watermarkColor: '#60a5fa',
                chromeTint: ['#60a5fa', '#3b82f6', '#bfdbfe']
            },
            // 16. Pure AMOLED Black
            {
                bgGrad: ['#000000', '#050505', '#0a0a0c'],
                glassBg: 'rgba(255, 255, 255, 0.08)',
                glassBorder: 'rgba(255, 255, 255, 0.2)',
                topCapsule: '#27272a',
                topCapsuleText: '#ffffff',
                mainCapsule: '#ffffff',
                mainCapsuleText: '#000000',
                btnGrad: ['#27272a', '#18181b'],
                btnBorder: 'rgba(255, 255, 255, 0.2)',
                btnTextColor: '#ffffff',
                badgeBg: '#3f3f46',
                badgeTextColor: '#ffffff',
                questionColor: '#e4e4e7',
                watermarkColor: '#a1a1aa',
                chromeTint: ['#52525b', '#71717a', '#a1a1aa']
            },
            // 17. Electric Rose
            {
                bgGrad: ['#4c0519', '#24020a', '#0f0104'],
                glassBg: 'rgba(244, 63, 94, 0.12)',
                glassBorder: 'rgba(251, 113, 133, 0.3)',
                topCapsule: '#fecdd3',
                topCapsuleText: '#000000',
                mainCapsule: '#ffffff',
                mainCapsuleText: '#000000',
                btnGrad: ['#ffe4e6', '#fecdd3'],
                btnBorder: 'rgba(255, 255, 255, 0.6)',
                btnTextColor: '#881337',
                badgeBg: '#ffffff',
                badgeTextColor: '#881337',
                questionColor: '#fff1f2',
                watermarkColor: '#fb7185',
                chromeTint: ['#fb7185', '#f43f5e', '#fda4af']
            },
            // 18. Clean Pastel Blue (Light Theme)
            {
                bgGrad: ['#f0f9ff', '#e0f2fe', '#bae6fd'],
                glassBg: 'rgba(255, 255, 255, 0.65)',
                glassBorder: 'rgba(255, 255, 255, 0.95)',
                topCapsule: '#bae6fd',
                topCapsuleText: '#0c4a6e',
                mainCapsule: '#0c4a6e',
                mainCapsuleText: '#ffffff',
                btnGrad: ['#ffffff', '#f0f9ff'],
                btnBorder: 'rgba(186, 230, 253, 0.8)',
                btnTextColor: '#082f49',
                badgeBg: '#e0f2fe',
                badgeTextColor: '#0c4a6e',
                questionColor: '#082f49',
                watermarkColor: '#0284c7',
                chromeTint: ['#bae6fd', '#38bdf8', '#7dd3fc']
            },
            // 19. Radioactive Neon Green
            {
                bgGrad: ['#052e16', '#021408', '#000803'],
                glassBg: 'rgba(34, 197, 94, 0.12)',
                glassBorder: 'rgba(74, 222, 128, 0.3)',
                topCapsule: '#86efac',
                topCapsuleText: '#000000',
                mainCapsule: '#ffffff',
                mainCapsuleText: '#000000',
                btnGrad: ['#dcfce7', '#86efac'],
                btnBorder: 'rgba(255, 255, 255, 0.6)',
                btnTextColor: '#14532d',
                badgeBg: '#ffffff',
                badgeTextColor: '#14532d',
                questionColor: '#f0fdf4',
                watermarkColor: '#22c55e',
                chromeTint: ['#4ade80', '#22c55e', '#86efac']
            }
        ];

        let currentThemeIndex = 0;

        function createThemeSwatches() {
            const container = $('themes');
            themes.forEach((t, i) => {
                const b = document.createElement('button');
                b.className = 'swatch' + (i === 0 ? ' active' : '');
                b.title = 'Theme ' + (i + 1);
                b.style.background = `linear-gradient(135deg, ${t.bgGrad[0]}, ${t.topCapsule}, ${t.chromeTint[0]})`;
                b.onclick = () => {
                    currentThemeIndex = i;
                    document.querySelectorAll('.swatch').forEach((el, idx) => el.classList.toggle('active', idx === i));
                    render();
                };
                container.appendChild(b);
            });
        }
        createThemeSwatches();

        // Hitboxes for Interactive Dragging
        let hitRegions = {
            question: { x: 0, y: 0, w: 0, h: 0 },
            options: { x: 0, y: 0, w: 0, h: 0 }
        };

        let draggingTarget = null;
        let dragStartY = 0;
        let initialValY = 0;

        function toggleDrawer() { $('drawer').classList.toggle('open'); }

        function sync() {
            ['contentY', 'questionY', 'optionsY', 'scale', 'bgDim', 'bgBlur'].forEach(id => {
                const v = $(id).value;
                if (id === 'scale' || id === 'bgDim') $(id + 'v').textContent = v + '%';
                else if (id === 'bgBlur') $(id + 'v').textContent = v + 'px';
                else $(id + 'v').textContent = v;
            });
        }

        ['topSubTitle', 'title', 'raw', 'watermark', 'ratio', 'contentY', 'questionY', 'optionsY', 'scale', 'bgDim', 'bgBlur'].forEach(id => {
            $(id).addEventListener(id === 'ratio' ? 'change' : 'input', render);
        });
        ['contentY', 'questionY', 'optionsY', 'scale', 'bgDim', 'bgBlur'].forEach(id => $(id).addEventListener('input', sync));

        // Background Upload
        $('bgUpload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const img = new Image();
                img.onload = () => {
                    customBgImg = img;
                    render();
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        });

        function removeBgImage() {
            customBgImg = null;
            $('bgUpload').value = '';
            render();
        }

        function setSize() {
            const r = $('ratio').value;
            if (r === '9:16') { C.width = 1080; C.height = 1920; }
            if (r === '1:1') { C.width = 1080; C.height = 1080; }
            if (r === '4:5') { C.width = 1080; C.height = 1350; }
            if (r === '16:9') { C.width = 1920; C.height = 1080; }
        }

        function drawRoundRect(c, x, y, w, h, r) {
            r = Math.min(r, w / 2, h / 2);
            c.beginPath();
            c.moveTo(x + r, y);
            c.lineTo(x + w - r, y);
            c.quadraticCurveTo(x + w, y, x + w, y + r);
            c.lineTo(x + w, y + h - r);
            c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            c.lineTo(x + r, y + h);
            c.quadraticCurveTo(x, y + h, x, y + h - r);
            c.lineTo(x, y + r);
            c.quadraticCurveTo(x, y, x + r, y);
            c.closePath();
        }

        function wrapText(c, text, x, y, maxWidth, lineHeight) {
            const words = text.split(/\s+/);
            let line = '';
            let currentY = y;
            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                if (c.measureText(testLine).width > maxWidth && n > 0) {
                    c.fillText(line, x, currentY);
                    line = words[n] + ' ';
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            c.fillText(line, x, currentY);
            return currentY;
        }

        // Draw 3D Liquid Chrome Droplet / Blob (Matches Screenshot Bottom-Right)
        function draw3DChromeBlob(c, cx, cy, size, colors) {
            c.save();
            c.translate(cx, cy);

            // Ambient Shadow
            c.shadowColor = 'rgba(0, 0, 0, 0.4)';
            c.shadowBlur = 30;
            c.shadowOffsetY = 15;

            // Liquid Droplet Base Shape
            c.beginPath();
            c.moveTo(0, -size * 0.5);
            c.bezierCurveTo(size * 0.45, -size * 0.4, size * 0.6, size * 0.2, size * 0.25, size * 0.6);
            c.bezierCurveTo(-size * 0.1, size * 0.85, -size * 0.55, size * 0.5, -size * 0.5, size * 0.1);
            c.bezierCurveTo(-size * 0.45, -size * 0.3, -size * 0.2, -size * 0.55, 0, -size * 0.5);
            c.closePath();

            // Iridescent Chrome Gradient Fill
            const grad = c.createLinearGradient(-size * 0.5, -size * 0.5, size * 0.5, size * 0.6);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.3, colors[0]);
            grad.addColorStop(0.65, colors[1]);
            grad.addColorStop(1, colors[2]);
            c.fillStyle = grad;
            c.fill();

            // High-Gloss Specular Rim / Highlight
            c.shadowBlur = 0;
            c.lineWidth = 3;
            c.strokeStyle = 'rgba(255, 255, 255, 0.85)';
            c.stroke();

            // Specular Dot
            c.fillStyle = '#ffffff';
            c.beginPath();
            c.arc(size * 0.1, -size * 0.15, size * 0.08, 0, Math.PI * 2);
            c.fill();

            c.restore();
        }

        // Draw 3D Background Mercury / Chrome Tubes & Toruses
        function drawBackgroundElements(c, W, H, theme) {
            c.save();
            // Top Left Iridescent Bulb/Blob
            const g1 = c.createRadialGradient(W * 0.05, H * 0.12, 20, W * 0.05, H * 0.12, 340);
            g1.addColorStop(0, theme.chromeTint[0]);
            g1.addColorStop(0.5, theme.chromeTint[1]);
            g1.addColorStop(1, 'transparent');
            c.fillStyle = g1;
            c.globalAlpha = 0.55;
            c.beginPath();
            c.arc(W * 0.05, H * 0.12, 340, 0, Math.PI * 2);
            c.fill();

            // Top Right 3D Soft Torus Cut
            c.globalAlpha = 0.35;
            c.lineWidth = 55;
            c.strokeStyle = theme.chromeTint[0];
            c.shadowColor = theme.chromeTint[0];
            c.shadowBlur = 40;
            c.beginPath();
            c.arc(W * 0.88, H * 0.05, 140, 0, Math.PI * 2);
            c.stroke();

            // Bottom Left Soft Glowing Torus
            c.beginPath();
            c.arc(W * 0.14, H * 0.96, 170, 0, Math.PI * 2);
            c.stroke();

            c.restore();
        }

        function parsed() {
            const ls = $('raw').value.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
            let q = ls[0] || 'What’s your favorite way to spend free time?';
            let opts = [];
            for (let i = 1; i < 5; i++) {
                opts.push((ls[i] || ['A. Reading', 'B. Watching movies', 'C. Traveling', 'D. Listening to music'][i - 1]).replace(/^[A-Da-d][\.\)\:\-\s]+/, ''));
            }
            return { q, opts };
        }

        // MASTER GRAPHICS RENDER
        function render() {
            setSize();
            const W = C.width, H = C.height;
            const theme = themes[currentThemeIndex];
            const scale = +$('scale').value / 100;

            const contentShift = +$('contentY').value * (H / 1920);
            const questionShift = +$('questionY').value * (H / 1920);
            const optionsShift = +$('optionsY').value * (H / 1920);

            // 1. BASE BACKGROUND
            if (customBgImg) {
                ctx.save();
                if (+$('bgBlur').value > 0) {
                    ctx.filter = `blur(${+$('bgBlur').value}px)`;
                }
                ctx.drawImage(customBgImg, 0, 0, W, H);
                ctx.filter = 'none';

                const dim = +$('bgDim').value / 100;
                if (dim > 0) {
                    ctx.fillStyle = `rgba(0, 0, 0, ${dim})`;
                    ctx.fillRect(0, 0, W, H);
                }
                ctx.restore();
            } else {
                const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
                bgGrad.addColorStop(0, theme.bgGrad[0]);
                bgGrad.addColorStop(0.5, theme.bgGrad[1]);
                bgGrad.addColorStop(1, theme.bgGrad[2]);
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, W, H);
            }

            // 2. 3D BACKGROUND ELEMENTS
            drawBackgroundElements(ctx, W, H, theme);

            // 3. MAIN FROSTED GLASS CARD (GLASSERPHISM)
            const cardW = W * 0.84 * scale;
            const cardH = H * 0.62 * scale;
            const cardX = (W - cardW) / 2;
            const cardY = H * 0.40 - (cardH * 0.15) + contentShift;
            const cardR = 55 * scale;

            ctx.save();
            ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
            ctx.shadowBlur = 50;
            ctx.shadowOffsetY = 25;
            ctx.fillStyle = theme.glassBg;
            drawRoundRect(ctx, cardX, cardY, cardW, cardH, cardR);
            ctx.fill();

            // Glass High-Spec Border
            ctx.shadowBlur = 0;
            ctx.lineWidth = 3.5;
            ctx.strokeStyle = theme.glassBorder;
            ctx.stroke();
            ctx.restore();

            // 4. STEPPED DOUBLE-LAYER HEADER CAPSULES
            const headerCenterY = cardY;

            // 4A. Top Pill ("ITS TIME TO")
            const topCapsuleW = W * 0.54 * scale;
            const topCapsuleH = 88 * scale;
            const topCapsuleX = (W - topCapsuleW) / 2;
            const topCapsuleY = headerCenterY - (75 * scale);

            ctx.save();
            ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
            ctx.shadowBlur = 20;
            ctx.shadowOffsetY = 8;
            ctx.fillStyle = theme.topCapsule;
            drawRoundRect(ctx, topCapsuleX, topCapsuleY, topCapsuleW, topCapsuleH, topCapsuleH / 2);
            ctx.fill();

            const subTitle = $('topSubTitle').value || "ITS TIME TO";
            ctx.font = `900 ${Math.round(42 * scale)}px "Montserrat", sans-serif`;
            ctx.fillStyle = theme.topCapsuleText;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(subTitle, W / 2, topCapsuleY + topCapsuleH / 2 - 8 * scale);
            ctx.restore();

            // 4B. Main Wide Capsule ("QUIZ SESSION")
            const mainCapsuleW = W * 0.82 * scale;
            const mainCapsuleH = 145 * scale;
            const mainCapsuleX = (W - mainCapsuleW) / 2;
            const mainCapsuleY = headerCenterY - (22 * scale);

            ctx.save();
            ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
            ctx.shadowBlur = 35;
            ctx.shadowOffsetY = 14;
            ctx.fillStyle = theme.mainCapsule;
            drawRoundRect(ctx, mainCapsuleX, mainCapsuleY, mainCapsuleW, mainCapsuleH, mainCapsuleH / 2);
            ctx.fill();

            const title = $('title').value || "QUIZ SESSION";
            ctx.font = `900 ${Math.round(80 * scale)}px "Montserrat", sans-serif`;
            ctx.fillStyle = theme.mainCapsuleText;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(title, W / 2, mainCapsuleY + mainCapsuleH / 2 + 3 * scale);
            ctx.restore();

            // 5. QUESTION TEXT (DRAGGABLE REGION)
            const { q, opts } = parsed();
            const qStartY = mainCapsuleY + mainCapsuleH + (80 * scale) + questionShift;

            ctx.save();
            ctx.font = `700 ${Math.round(44 * scale)}px "Plus Jakarta Sans", sans-serif`;
            ctx.fillStyle = theme.questionColor;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const lastQY = wrapText(ctx, q, W / 2, qStartY, cardW * 0.86, 54 * scale);
            ctx.restore();

            hitRegions.question = {
                x: cardX,
                y: qStartY - 30 * scale,
                w: cardW,
                h: (lastQY - qStartY) + 60 * scale
            };

            // 6. 4 VERTICAL GRADIENT PILL BUTTONS (EXACT SCREENSHOT LAYOUT)
            const optW = cardW * 0.82;
            const optH = 92 * scale;
            const optGap = 24 * scale;
            const optStartX = (W - optW) / 2;
            const defaultGridStartY = lastQY + (65 * scale);
            const optStartY = defaultGridStartY + optionsShift;

            const optLetters = ['A', 'B', 'C', 'D'];

            for (let i = 0; i < 4; i++) {
                const by = optStartY + i * (optH + optGap);

                ctx.save();
                // Button Ambient Shadow
                ctx.shadowColor = 'rgba(0, 0, 0, 0.18)';
                ctx.shadowBlur = 18;
                ctx.shadowOffsetY = 8;

                // Glossy Gradient Fill
                const btnGrad = ctx.createLinearGradient(optStartX, by, optStartX + optW, by);
                btnGrad.addColorStop(0, theme.btnGrad[0]);
                btnGrad.addColorStop(1, theme.btnGrad[1]);
                ctx.fillStyle = btnGrad;
                drawRoundRect(ctx, optStartX, by, optW, optH, optH / 2);
                ctx.fill();

                // Button High-Gloss Rim
                ctx.shadowBlur = 0;
                ctx.lineWidth = 2;
                ctx.strokeStyle = theme.btnBorder;
                ctx.stroke();

                // Left White Circular Badge
                const badgeR = 32 * scale;
                const badgeX = optStartX + badgeR + (14 * scale);
                const badgeY = by + optH / 2;

                ctx.fillStyle = theme.badgeBg;
                ctx.beginPath();
                ctx.arc(badgeX, badgeY, badgeR, 0, Math.PI * 2);
                ctx.fill();

                // Option Letter Text
                ctx.font = `800 ${Math.round(30 * scale)}px "Montserrat", sans-serif`;
                ctx.fillStyle = theme.badgeTextColor;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(optLetters[i], badgeX, badgeY + 1);

                // Option Answer Text
                ctx.font = `700 ${Math.round(36 * scale)}px "Plus Jakarta Sans", sans-serif`;
                ctx.fillStyle = theme.btnTextColor;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                let txt = opts[i];
                const maxTxtW = optW - (badgeR * 2) - (80 * scale);
                if (ctx.measureText(txt).width > maxTxtW) {
                    while (ctx.measureText(txt + '...').width > maxTxtW && txt.length > 0) {
                        txt = txt.slice(0, -1);
                    }
                    txt += '...';
                }
                ctx.fillText(txt, optStartX + optW / 2 + (20 * scale), by + optH / 2);

                ctx.restore();
            }

            hitRegions.options = {
                x: optStartX,
                y: optStartY,
                w: optW,
                h: 4 * optH + (3 * optGap)
            };

            // 7. 3D FLOATING CHROME DROPLET (BOTTOM-RIGHT)
            draw3DChromeBlob(ctx, W * 0.82, cardY + cardH * 0.72, 110 * scale, theme.chromeTint);
            draw3DChromeBlob(ctx, W * 0.92, cardY + cardH * 0.98, 220 * scale, theme.chromeTint);

            // 8. BOTTOM WATERMARK
            const wm = $('watermark').value || '@4xlearner';
            ctx.save();
            ctx.font = `700 ${Math.round(36 * scale)}px "Plus Jakarta Sans", sans-serif`;
            ctx.fillStyle = theme.watermarkColor;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(wm, W / 2, H - (90 * (H / 1920)));
            ctx.restore();
        }

        // TOUCH & MOUSE DRAGGING ENGINE
        function getCanvasCoordinates(e) {
            const rect = C.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const scaleX = C.width / rect.width;
            const scaleY = C.height / rect.height;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY,
                rawY: clientY
            };
        }

        function onPointerDown(e) {
            const pos = getCanvasCoordinates(e);

            if (pos.x >= hitRegions.options.x && pos.x <= hitRegions.options.x + hitRegions.options.w &&
                pos.y >= hitRegions.options.y && pos.y <= hitRegions.options.y + hitRegions.options.h) {
                draggingTarget = 'options';
                dragStartY = pos.rawY;
                initialValY = +$('optionsY').value;
                return;
            }

            if (pos.x >= hitRegions.question.x && pos.x <= hitRegions.question.x + hitRegions.question.w &&
                pos.y >= hitRegions.question.y && pos.y <= hitRegions.question.y + hitRegions.question.h) {
                draggingTarget = 'question';
                dragStartY = pos.rawY;
                initialValY = +$('questionY').value;
                return;
            }
        }

        function onPointerMove(e) {
            if (!draggingTarget) return;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const deltaY = clientY - dragStartY;

            const rect = C.getBoundingClientRect();
            const scaleFactor = (C.height / rect.height) * (1920 / C.height);
            const computedY = Math.round(initialValY + deltaY * scaleFactor);

            if (draggingTarget === 'options') {
                $('optionsY').value = Math.max(-350, Math.min(350, computedY));
            } else if (draggingTarget === 'question') {
                $('questionY').value = Math.max(-300, Math.min(300, computedY));
            }

            sync();
            render();
        }

        function onPointerUp() {
            draggingTarget = null;
        }

        C.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        C.addEventListener('touchstart', onPointerDown, { passive: true });
        window.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerUp);

        // TRUE 4K DIRECT DOWNLOAD (NO THIRD-PARTY BUGS)
        function downloadPNG() {
            const ow = C.width, oh = C.height;
            const sc = 2; // True 4K scale (2160x3840)
            const r = $('ratio').value;
            let w = 1080, h = 1920;
            if (r === '1:1') { w = 1080; h = 1080; }
            if (r === '4:5') { w = 1080; h = 1350; }
            if (r === '16:9') { w = 1920; h = 1080; }

            C.width = w * sc; C.height = h * sc;
            render();

            const url = C.toDataURL('image/png', 1.0);
            const a = document.createElement('a');
            a.href = url;
            a.download = `4X-LiquidChrome-Quiz-4K-${Date.now()}.png`;
            document.body.appendChild(a);
            a.click();
            a.remove();

            C.width = ow; C.height = oh;
            render();
        }

        function resetAll() {
            $('topSubTitle').value = "ITS TIME TO";
            $('title').value = "QUIZ SESSION";
            $('raw').value = "What’s your favorite way to spend free time?\nA. Reading\nB. Watching movies\nC. Traveling\nD. Listening to music";
            $('watermark').value = '@4xlearner';
            $('ratio').value = '9:16';
            $('contentY').value = 0;
            $('questionY').value = 0;
            $('optionsY').value = 0;
            $('scale').value = 100;
            $('bgDim').value = 0;
            $('bgBlur').value = 0;
            currentThemeIndex = 0;
            removeBgImage();
            sync();
            render();
        }

        document.fonts.ready.then(() => {
            sync();
            render();
        });

        window.addEventListener('resize', () => requestAnimationFrame(render));
    </script>
