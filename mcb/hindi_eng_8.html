<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>4X Learner - Ultra 4K & Viral Video Studio</title>

    <link

        rel="stylesheet" />

    <style>
        :root {
            --bg: #030712;
            --panel: #0b1120;
            --border: #1e293b;
            --accent: #f59e0b;
            --text: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Mobile Hamburger Button */
        .mobile-btn {
            display: none;
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 100;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 900;
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.4);
            cursor: pointer;
        }

        /* Control Panel */
        .controls {
            width: 440px;
            min-width: 440px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            z-index: 50;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .controls::-webkit-scrollbar {
            width: 5px;
        }

        .controls::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: 900;
            color: #fbbf24;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .brand-header span {
            color: #ef4444;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 0.6px;
        }

        input,
        select,
        textarea,
        button {
            background: #060a12;
            color: #fff;
            border: 1px solid #1e293b;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
        }

        textarea {
            resize: vertical;
            height: 125px;
            font-family: monospace;
            font-size: 0.76rem;
            line-height: 1.45;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--accent);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        button {
            cursor: pointer;
            font-weight: 900;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            filter: brightness(1.18);
            transform: translateY(-1px);
        }

        .btn-theme {
            background: #1e293b;
            color: #f8fafc;
        }

        .btn-preview {
            background: #0284c7;
            color: #fff;
            border: none;
        }

        .btn-4k {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
        }

        .btn-video-3s {
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            color: #fff;
            border: none;
            padding: 13px;
            font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        .btn-video-fast {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: #fff;
            border: none;
            padding: 13px;
            font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
        }

        /* Preview Stage */
        .preview-stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #020617;
            overflow: auto;
            padding: 24px;
            position: relative;
        }

        /* 9:16 Canvas Box */
        .reels-viewport {
            width: 360px;
            height: 640px;
            max-height: 94vh;
            aspect-ratio: 9 / 16;
            border-radius: 28px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.95), 0 0 0 2px #334155;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 22px 16px;
            transition: all 0.3s;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            z-index: 10;
        }

        .learner-logo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            padding: 6px 14px;
            border-radius: 30px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-badge {
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            color: #fff;
            font-weight: 900;
            font-size: 0.82rem;
            padding: 2px 7px;
            border-radius: 6px;
        }

        .logo-text {
            font-size: 0.82rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .social-tag {
            font-size: 0.76rem;
            font-weight: 800;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(6px);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Title Area */
        .title-banner {
            text-align: center;
            margin: 6px 0 2px;
            z-index: 5;
        }

        .title-banner h1 {
            font-size: 1.35rem;
            font-weight: 900;
            line-height: 1.15;
            text-transform: uppercase;
        }

        .title-banner p {
            font-size: 0.76rem;
            font-weight: 800;
            margin-top: 3px;
        }

        /* Cards List */
        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            z-index: 5;
        }

        /* Exact Reference Infographic Card */
        .info-card-wrap {
            display: flex;
            align-items: center;
            width: 100%;
            position: relative;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.1));
            will-change: transform, opacity;
        }

        .info-card {
            flex: 1;
            height: 64px;
            border-radius: 12px 0 0 12px;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            background: #ffffff;
        }

        .card-left-tab {
            width: 12px;
            height: 100%;
            border-radius: 12px 0 0 12px;
            flex-shrink: 0;
        }

        .card-num-box {
            padding: 0 10px 0 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid rgba(0, 0, 0, 0.08);
            min-width: 58px;
        }

        .card-num-box .num {
            font-size: 1.35rem;
            font-weight: 900;
            line-height: 1;
            font-family: 'Montserrat', sans-serif;
        }

        .card-num-box .lbl {
            font-size: 0.58rem;
            font-weight: 900;
            opacity: 0.7;
        }

        .card-content {
            flex: 1;
            padding: 0 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        .card-hindi {
            font-size: 0.82rem;
            font-weight: 900;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-eng {
            font-size: 0.78rem;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-icon-area {
            padding-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .card-chevron {
            width: 32px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            clip-path: polygon(0% 0%, 55% 0%, 100% 50%, 55% 100%, 0% 100%, 45% 50%);
            border-radius: 0 10px 10px 0;
            margin-left: -2px;
            position: relative;
            z-index: 2;
        }

        /* Bottom Hook */
        .bottom-hook {
            text-align: center;
            font-size: 0.74rem;
            font-weight: 800;
            padding: 8px 16px;
            border-radius: 20px;
            width: fit-content;
            margin: 0 auto;
            z-index: 5;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
            background: rgba(15, 23, 42, 0.9);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Top Running Progress Bar */
        .viewport-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 4px;
            width: 0%;
            background: linear-gradient(90deg, #f59e0b, #ef4444);
            z-index: 20;
        }

        /* Mobile Drawer Responsive */
        @media (max-width: 860px) {
            .mobile-btn {
                display: block;
            }

            .controls {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                transform: translateX(-100%);
                width: 90%;
                min-width: unset;
                box-shadow: 20px 0 50px rgba(0, 0, 0, 0.9);
            }

            .controls.open {
                transform: translateX(0);
            }

            .preview-stage {
                padding: 60px 10px 20px;
            }

            .reels-viewport {
                width: 100%;
                max-width: 350px;
                height: calc(100vw * 16 / 9);
                max-height: 86vh;
            }
        }
    </style>
</head>

        // Web Audio Dynamic Swoosh Sound Engine
        function playSwooshAudio(audioCtx, time) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(520, time);
                osc.frequency.exponentialRampToValueAtTime(80, time + 0.12);
                gain.gain.setValueAtTime(0.35, time);
                gain.gain.exponentialRampToValueAtTime(0.01, time + 0.12);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(time);
                osc.stop(time + 0.13);
            } catch (e) { }
        }

        function playCurrentAnimation() {
            closeMenu();
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const [animIndex, speed] = document.getElementById("animSelect").value.split(":").map(Number);
            const interval = speed;
            const wraps = document.querySelectorAll(".info-card-wrap");

            wraps.forEach((el, i) => {
                el.style.opacity = "0";
                // Pick animation transform based on preset
                if (animIndex === 0) el.style.transform = "scale(0.3) translateY(80px)";
                else if (animIndex === 1) el.style.transform = "translateX(-320px)";
                else if (animIndex === 2) el.style.transform = "translateX(320px)";
                else if (animIndex === 3) el.style.transform = "perspective(500px) rotateY(90deg)";
                else if (animIndex === 4) el.style.transform = "perspective(500px) rotateX(90deg)";
                else el.style.transform = "scale(0.2) rotate(-15deg)";

                setTimeout(() => {
                    playSwooshAudio(audioCtx, audioCtx.currentTime);
                    el.style.transition = `all ${speed / 1000}s cubic-bezier(0.175, 0.885, 0.32, 1.275)`;
                    el.style.opacity = "1";
                    el.style.transform = "none";
                }, i * (interval * 0.85));
            });
        }

        // ==========================================
        // TRUE 4K (2160x3840) CANVAS ENGINE
        // ==========================================
        function drawInfographicCanvas(ctx, W, H, elapsedMs = 9999, isStatic4K = false) {
            const scale = W / 1080;

            // 1. Background
            ctx.fillStyle = activeTheme.bg;
            ctx.fillRect(0, 0, W, H);

            // Subtle modern dot mesh
            ctx.fillStyle = activeTheme.text === "#ffffff" ? "rgba(255,255,255,0.04)" : "rgba(0,0,0,0.04)";
            for (let x = 30 * scale; x < W; x += 55 * scale) {
                for (let y = 30 * scale; y < H; y += 55 * scale) {
                    ctx.beginPath();
                    ctx.arc(x, y, 2.5 * scale, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // 2. Top-Left 4X LEARNER Badge
            ctx.save();
            const badgeW = 340 * scale;
            const badgeH = 75 * scale;
            const badgeX = 60 * scale;
            const badgeY = 70 * scale;

            ctx.fillStyle = "rgba(15, 23, 42, 0.95)";
            ctx.shadowColor = "rgba(0,0,0,0.25)";
            ctx.shadowBlur = 20 * scale;
            ctx.shadowOffsetY = 8 * scale;
            roundRect(ctx, badgeX, badgeY, badgeW, badgeH, 38 * scale, true);
            ctx.shadowColor = "transparent";

            const redGrad = ctx.createLinearGradient(badgeX, badgeY, badgeX + 80 * scale, badgeY + badgeH);
            redGrad.addColorStop(0, "#f59e0b");
            redGrad.addColorStop(1, "#ef4444");
            ctx.fillStyle = redGrad;
            roundRect(ctx, badgeX + 10 * scale, badgeY + 10 * scale, 80 * scale, badgeH - 20 * scale, 16 * scale, true);

            ctx.fillStyle = "#ffffff";
            ctx.font = `900 ${32 * scale}px 'Poppins', sans-serif`;
            ctx.textAlign = "center";
            ctx.fillText("4X", badgeX + 50 * scale, badgeY + 50 * scale);

            ctx.font = `900 ${30 * scale}px 'Poppins', sans-serif`;
            ctx.textAlign = "left";
            ctx.fillText("LEARNER", badgeX + 105 * scale, badgeY + 50 * scale);

            // Top-Right Clean @4xlearner Tag
            ctx.fillStyle = "rgba(15, 23, 42, 0.8)";
            roundRect(ctx, W - 250 * scale, badgeY + 8 * scale, 190 * scale, 60 * scale, 30 * scale, true);
            ctx.fillStyle = "#38bdf8";
            ctx.font = `900 ${24 * scale}px 'Poppins', sans-serif`;
            ctx.textAlign = "center";
            ctx.fillText("@4xlearner", W - 155 * scale, badgeY + 46 * scale);
            ctx.restore();

            // 3. Headline & Sub-Hook
            ctx.save();
            ctx.textAlign = "center";
            ctx.fillStyle = activeTheme.text;
            ctx.font = `900 ${52 * scale}px 'Cabinet Grotesk', 'Montserrat', sans-serif`;
            ctx.fillText(document.getElementById("headTitle").value, W / 2, 235 * scale);

            ctx.fillStyle = activeTheme.sub;
            ctx.font = `800 ${30 * scale}px 'Poppins', sans-serif`;
            ctx.fillText(document.getElementById("headSub").value, W / 2, 285 * scale);
            ctx.restore();

            // 4. Cards Rendering with High-Speed Animation
            const data = parseCardsData();
            const startY = 345 * scale;
            const cardW = 860 * scale;
            const cardH = 175 * scale;
            const chevronW = 85 * scale;
            const gap = 36 * scale;
            const leftX = 60 * scale;

            const [animIndex, speed] = document.getElementById("animSelect").value.split(":").map(Number);
            const stepDuration = isStatic4K ? 0 : speed;

            data.forEach((item, idx) => {
                const cardStartTime = idx * (stepDuration * 0.85);
                const cardElapsed = Math.max(0, elapsedMs - cardStartTime);
                let progress = isStatic4K ? 1.0 : Math.min(1.0, cardElapsed / stepDuration);

                if (progress <= 0) return;

                // Elastic Bounce Formula
                const ease = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress) * Math.cos((progress * 10 - 0.75) * ((2 * Math.PI) / 3));

                const y = startY + idx * (cardH + gap);
                const color = activeTheme.colors[idx % activeTheme.colors.length];

                ctx.save();
                ctx.translate(leftX, y);

                // Apply Selected Animation Transformation
                if (!isStatic4K) {
                    if (animIndex === 0) {
                        const curScale = 0.4 + 0.6 * ease;
                        ctx.translate((cardW + chevronW) / 2, cardH / 2);
                        ctx.scale(curScale, curScale);
                        ctx.translate(-(cardW + chevronW) / 2, -cardH / 2);
                    } else if (animIndex === 1) {
                        ctx.translate((1 - ease) * -400 * scale, 0);
                    } else if (animIndex === 2) {
                        ctx.translate((1 - ease) * 400 * scale, 0);
                    }
                    ctx.globalAlpha = Math.min(1.0, progress * 1.5);
                }

                // Card Drop Shadow
                ctx.shadowColor = "rgba(0, 0, 0, 0.16)";
                ctx.shadowBlur = 24 * scale;
                ctx.shadowOffsetY = 10 * scale;

                // White/Themed Card Body
                ctx.fillStyle = activeTheme.cardBg;
                roundRect(ctx, 0, 0, cardW, cardH, 24 * scale, true);
                ctx.shadowColor = "transparent";

                // Left Colored Tab
                ctx.fillStyle = color;
                roundLeftTab(ctx, 0, 0, 32 * scale, cardH, 24 * scale);

                // Number + TALK column
                ctx.fillStyle = activeTheme.cardText;
                ctx.font = `900 ${56 * scale}px 'Montserrat', sans-serif`;
                ctx.textAlign = "center";
                ctx.fillText(item.num, 115 * scale, 95 * scale);

                ctx.fillStyle = activeTheme.cardText;
                ctx.globalAlpha = 0.65;
                ctx.font = `900 ${22 * scale}px 'Poppins', sans-serif`;
                ctx.fillText("TALK", 115 * scale, 132 * scale);
                ctx.globalAlpha = 1.0;

                // Thin Divider
                ctx.strokeStyle = "rgba(0,0,0,0.08)";
                ctx.lineWidth = 2 * scale;
                ctx.beginPath();
                ctx.moveTo(180 * scale, 30 * scale);
                ctx.lineTo(180 * scale, cardH - 30 * scale);
                ctx.stroke();

                // Hindi Sentence
                ctx.fillStyle = activeTheme.cardText;
                ctx.font = `800 ${34 * scale}px 'Poppins', sans-serif`;
                ctx.textAlign = "left";
                ctx.fillText(item.hindi, 215 * scale, 78 * scale);

                // English Dialogue
                ctx.fillStyle = color;
                ctx.font = `900 ${36 * scale}px 'Cabinet Grotesk', 'Montserrat', sans-serif`;
                ctx.fillText(item.english, 215 * scale, 130 * scale);

                // Right Icon Ring
                ctx.save();
                ctx.strokeStyle = color;
                ctx.lineWidth = 4 * scale;
                ctx.beginPath();
                ctx.arc(cardW - 65 * scale, cardH / 2, 38 * scale, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = color;
                ctx.font = `900 ${34 * scale}px 'Font Awesome 6 Free', 'Font Awesome 6 Brands'`;
                ctx.textAlign = "center";
                ctx.fillText("✓", cardW - 65 * scale, cardH / 2 + 12 * scale);
                ctx.restore();

                // Distinct 3D Chevron Notch Arrow
                ctx.save();
                ctx.fillStyle = color;
                ctx.shadowColor = "rgba(0, 0, 0, 0.18)";
                ctx.shadowBlur = 18 * scale;
                ctx.shadowOffsetY = 6 * scale;

                const chevX = cardW + 8 * scale;
                ctx.beginPath();
                ctx.moveTo(chevX, 0);
                ctx.lineTo(chevX + chevronW * 0.55, 0);
                ctx.lineTo(chevX + chevronW, cardH / 2);
                ctx.lineTo(chevX + chevronW * 0.55, cardH);
                ctx.lineTo(chevX, cardH);
                ctx.lineTo(chevX + chevronW * 0.45, cardH / 2);
                ctx.closePath();
                ctx.fill();
                ctx.restore();

                ctx.restore();
            });

            // 5. Bottom Engaging Hook Box
            ctx.save();
            ctx.fillStyle = "rgba(15, 23, 42, 0.95)";
            ctx.shadowColor = "rgba(0,0,0,0.25)";
            ctx.shadowBlur = 25 * scale;
            ctx.shadowOffsetY = 10 * scale;
            roundRect(ctx, W / 2 - 390 * scale, H - 150 * scale, 780 * scale, 75 * scale, 38 * scale, true);
            ctx.shadowColor = "transparent";

            ctx.fillStyle = "#ffffff";
            ctx.font = `800 ${28 * scale}px 'Poppins', sans-serif`;
            ctx.textAlign = "center";
            ctx.fillText("🔥 Save Karo & Follow @4xlearner for Daily Fluency!", W / 2, H - 102 * scale);
            ctx.restore();
        }

        // Shape Helpers
        function roundRect(ctx, x, y, width, height, radius, fill) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            if (fill) ctx.fill();
        }

        function roundLeftTab(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width, y);
            ctx.lineTo(x + width, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            ctx.fill();
        }

        // ==========================================
        // 60FPS DUAL-MODE VIDEO EXPORT ENGINE
        // ==========================================
        async function exportVideo(durationMs, filenamePrefix) {
            await document.fonts.ready;
            closeMenu();

            const btn = durationMs > 2000 ? document.getElementById("videoBtn3s") : document.getElementById("videoBtnFast");
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Rendering 60FPS Video...`;
            btn.disabled = true;

            const W = 1080;
            const H = 1920;
            const canvas = document.createElement("canvas");
            canvas.width = W;
            canvas.height = H;
            const ctx = canvas.getContext("2d");

            // Setup Audio + Video Track Stream
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const dest = audioCtx.createMediaStreamDestination();
            const canvasStream = canvas.captureStream(60);

            const combinedStream = new MediaStream([
                ...canvasStream.getVideoTracks(),
                ...dest.stream.getAudioTracks()
            ]);

            const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
            const recorder = new MediaRecorder(combinedStream, {
                mimeType: mime,
                videoBitsPerSecond: 18000000 // 18 Mbps Ultra Crisp Bitrate
            });

            const chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: "video/webm" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `4XLearner_${filenamePrefix}_${Date.now()}.webm`;
                a.click();
                btn.innerHTML = originalText;
                btn.disabled = false;
            };

            recorder.start();

            // Trigger Swoosh Sound for every card
            const data = parseCardsData();
            const [, speed] = document.getElementById("animSelect").value.split(":").map(Number);
            data.forEach((_, i) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(540, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                    osc.connect(gain);
                    gain.connect(dest);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.13);
                }, i * (speed * 0.85));
            });

            const startTime = performance.now();

            function frame(now) {
                const elapsed = now - startTime;
                drawInfographicCanvas(ctx, W, H, elapsed, false);

                if (elapsed < durationMs) {
                    requestAnimationFrame(frame);
                } else {
                    recorder.stop();
                }
            }
            requestAnimationFrame(frame);
        }

        // Initialize Theme & Cards
        applyTheme();
    </script>
</body>
